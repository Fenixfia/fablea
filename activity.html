<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Entra nell’esperienza</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
padding:24px;
font-family:'Nunito',sans-serif;
background:
radial-gradient(circle at top left,#fff1d8 0%,transparent 30%),
radial-gradient(circle at bottom right,#e7dcff 0%,transparent 34%),
linear-gradient(135deg,#f8f1e8 0%,#ece4ea 45%,#d9ddea 100%);
display:flex;
justify-content:center;
align-items:center;
color:#352f36;
}

.card{
width:92%;
max-width:980px;
padding:52px 42px;
border-radius:44px;
background:rgba(255,251,247,.78);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.62);
box-shadow:0 24px 80px rgba(70,60,50,.12);
text-align:center;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:14px;
flex-wrap:wrap;
margin-bottom:30px;
}

.back{
display:inline-flex;
align-items:center;
justify-content:center;
padding:12px 17px;
border-radius:999px;
background:rgba(255,255,255,.58);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
font-size:14px;
font-weight:900;
text-decoration:none;
}

.badge{
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#9f8a76;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:58px;
line-height:1.05;
font-weight:600;
margin-bottom:14px;
}

.subtitle{
font-size:18px;
line-height:1.7;
color:#756c70;
max-width:720px;
margin:0 auto 30px;
}

.visual-zone{
min-height:300px;
border-radius:38px;
margin:28px auto;
background:
radial-gradient(circle at 50% 35%,#fff8d8 0%,transparent 24%),
radial-gradient(circle at 20% 80%,#ffd9be 0%,transparent 24%),
linear-gradient(135deg,#efe5ff,#f9e7b6);
box-shadow:inset 0 0 80px rgba(255,255,255,.62);
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
}

.big-image{
font-size:96px;
animation:float 4.5s ease-in-out infinite;
z-index:2;
}

@keyframes float{
0%{transform:translateY(0) scale(1)}
50%{transform:translateY(-8px) scale(1.04)}
100%{transform:translateY(0) scale(1)}
}

.glow{
position:absolute;
width:170px;
height:170px;
border-radius:50%;
background:rgba(255,244,190,.55);
filter:blur(18px);
animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{
0%{transform:scale(.9);opacity:.55}
50%{transform:scale(1.15);opacity:.9}
100%{transform:scale(.9);opacity:.55}
}

.activity{
max-width:760px;
margin:0 auto;
font-size:23px;
line-height:1.8;
color:#4d4550;
}

.activity strong{
color:#342f38;
}

.options{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:30px;
}

.option{
padding:20px 16px;
border-radius:26px;
background:rgba(255,255,255,.52);
border:1px solid rgba(80,65,55,.10);
font-size:18px;
font-weight:900;
cursor:pointer;
transition:.25s;
}

.option:hover{
transform:translateY(-3px);
background:rgba(255,255,255,.74);
}

.result{
margin-top:30px;
padding:28px;
border-radius:30px;
background:rgba(255,255,255,.56);
font-size:22px;
line-height:1.8;
color:#5f575c;
display:none;
text-align:left;
}

.actions{
margin-top:40px;
display:flex;
gap:16px;
justify-content:center;
flex-wrap:wrap;
}

.button{
padding:15px 28px;
border-radius:999px;
text-decoration:none;
font-size:16px;
font-weight:900;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#322d34;
box-shadow:0 12px 30px rgba(231,200,112,.25);
border:0;
cursor:pointer;
}

.secondary{
background:rgba(255,255,255,.58);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
box-shadow:none;
}

@media(max-width:760px){
body{padding:18px}
.card{padding:40px 22px;border-radius:32px}
.top{justify-content:center}
h1{font-size:40px}
.subtitle{font-size:16px}
.visual-zone{min-height:250px}
.big-image{font-size:76px}
.activity{font-size:19px}
.options{grid-template-columns:1fr}
.button{width:100%}
}
</style>
</head>

<body>

<main class="card">

<div class="top">
<a class="back" href="/story-result.html">← Torna alla storia</a>
<div class="badge" id="badge">FABLEA Activity</div>
<a class="back" href="/child-hub.html">Mondo bambino</a>
</div>

<h1 id="title">Entra nell’esperienza</h1>

<div class="subtitle" id="subtitle">
Una piccola attività per trasformare la storia in immaginazione, movimento, calma o creatività.
</div>

<div class="visual-zone">
<div class="glow"></div>
<div class="big-image" id="bigImage">✨</div>
</div>

<div class="activity" id="activityText"></div>

<div class="options" id="options"></div>

<div class="result" id="resultBox"></div>

<div class="actions">
<a class="button" href="/story-player.html">Ascolta la voce narrante</a>
<a class="button secondary" href="/manualita.html">Crea con le mani</a>
<a class="button secondary" href="/story.html">Nuova esperienza</a>
<a class="button secondary" href="/child-hub.html">Torna al mondo</a>
<a class="button secondary" href="/library.html">Libreria</a>
</div>

</main>

<script>
const savedData = JSON.parse(localStorage.getItem('fableaStoryData') || '{}');

const name = savedData.name || 'piccolo esploratore';
const age = savedData.age || '5-7';
const theme = savedData.theme || 'Foresta magica';
const experience = savedData.experience || 'Avventura immaginativa';
const mood = savedData.mood || 'Curiosa';

const badge = document.getElementById('badge');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const bigImage = document.getElementById('bigImage');
const activityText = document.getElementById('activityText');
const options = document.getElementById('options');
const resultBox = document.getElementById('resultBox');

function hasTheme(word){
return theme.toLowerCase().includes(word.toLowerCase()) || experience.toLowerCase().includes(word.toLowerCase());
}

function showResult(text,image){
resultBox.style.display='block';
resultBox.innerHTML=text;
if(image){
bigImage.innerText=image;
}
}

function addOption(label,text,image){
const div=document.createElement('div');
div.className='option';
div.innerText=label;
div.onclick=function(){
showResult(text,image);
};
options.appendChild(div);
}

if(age === '2-4'){

badge.innerText='2–4 anni • Meraviglia';
title.innerText='Guarda, tocca, immagina';
subtitle.innerText='Un’attività breve, visiva e morbida per accompagnare attenzione, calma e fantasia.';

if(hasTheme('lupo')){

bigImage.innerText='🐺 🌙';

activityText.innerHTML=`
<strong>${name}</strong>, il lupo dal vocione è ancora nel bosco.<br><br>
Non vuole fare paura.<br>
Vuole imparare a parlare piano.<br><br>
Aiutiamolo insieme.
`;

addOption(
'🌙 Guarda la luna',
`
La luna illumina il bosco lentamente.<br><br>
Il lupo alza il naso verso il cielo.<br>
Respira piano.<br><br>
Il suo vocione diventa più morbido.
`,
'🌙🐺'
);

addOption(
'🤍 Carezza immaginaria',
`
${name} allunga la mano lentamente.<br><br>
Il lupo chiude gli occhi.<br>
La carezza immaginaria gli dice:<br><br>
“Va tutto bene.”`,
'🤍🐺'
);

addOption(
'✨ Accendi la luce',
`
Una piccola luce compare tra le foglie.<br><br>
Il bosco non sembra più buio.<br>
Il lupo si sdraia vicino alla luce e resta calmo.`,
'✨🐺'
);

}else{

bigImage.innerText='🌙 🧸';

activityText.innerHTML=`
<strong>${name}</strong>, il piccolo mondo FABLEA è ancora acceso.<br><br>
C’è una luce morbida.<br>
Un orsetto vicino.<br>
E una stellina che aspetta.
`;

addOption(
'🌙 Guarda la luna',
`
La luna si muove piano nel cielo.<br><br>
Inspira lentamente.<br>
Espira lentamente.<br><br>
Il corpo diventa morbido.`,
'🌙'
);

addOption(
'🧸 Abbraccia l’orsetto',
`
L’orsetto si avvicina.<br><br>
Non parla forte.<br>
Resta semplicemente vicino a ${name}.`,
'🧸'
);

addOption(
'✨ Segui la stellina',
`
La stellina lascia una piccola scia luminosa.<br><br>
Non corre.<br>
Aspetta che ${name} la segua piano.`,
'✨'
);

}

}else if(age === '5-7'){

badge.innerText='5–7 anni • Esplorazione';
title.innerText='Scegli il prossimo passo';
subtitle.innerText='Una piccola scelta per continuare il viaggio e trasformare la storia in esperienza.';

bigImage.innerText=hasTheme('principesse') ? '👑 ☁️' : '🗺️ 🦊';

activityText.innerHTML=`
<strong>${name}</strong>, davanti a te si aprono tre strade.<br><br>
Ognuna porta verso qualcosa di nuovo.<br>
Quale scegli?
`;

if(hasTheme('principesse')){

addOption(
'👑 La corona',
`
La corona luminosa si accende.<br><br>
Non rende più potenti.<br>
Ricorda soltanto di essere gentili anche quando si ha paura.`,
'👑✨'
);

addOption(
'☁️ Le nuvole',
`
Le nuvole si aprono lentamente.<br><br>
Dietro compare un castello sospeso nel cielo.<br>
La principessa sorride e invita ${name} a entrare.`,
'☁️🏰'
);

addOption(
'⭐ La stella',
`
Una piccola stella cade vicino al sentiero.<br><br>
Quando ${name} la tocca, compare una strada nuova fatta di luce.`,
'⭐🛤️'
);

}else{

addOption(
'🌲 Segui la volpe',
`
La volpe attraversa il bosco lentamente.<br><br>
Ogni albero sembra sussurrare una parola gentile.`,
'🌲🦊'
);

addOption(
'🌊 Vai verso il mare',
`
Il sentiero porta a un piccolo mare calmo.<br><br>
Le onde respirano lentamente insieme a ${name}.`,
'🌊⭐'
);

addOption(
'⭐ Tocca la stella',
`
La stella illumina la mappa.<br><br>
Un nuovo simbolo compare sulla carta e il viaggio continua.`,
'⭐🗺️'
);

}

}else if(age === '8-10'){

badge.innerText='8–10 anni • Identità';
title.innerText='Dai un nome a quello che senti';
subtitle.innerText='Una pausa narrativa per riconoscere emozioni, fiducia e piccoli cambiamenti interiori.';

bigImage.innerText='💛 🌉';

activityText.innerHTML=`
<strong>${name}</strong>, sul ponte delle scelte sono apparse tre luci.<br><br>
Non devi scegliere la più forte.<br>
Solo quella che senti più vicina oggi.
`;

addOption(
'💛 Fiducia',
`
La fiducia non cancella i dubbi.<br><br>
Aiuta soltanto a fare un passo anche quando non si vede tutta la strada.`,
'💛'
);

addOption(
'🛡️ Coraggio',
`
Il coraggio non deve essere enorme.<br><br>
A volte basta restare gentili quando sarebbe più facile chiudersi.`,
'🛡️'
);

addOption(
'🌧️ Calma',
`
La calma non corre.<br><br>
Si siede accanto a ${name}.<br>
Aspetta.<br>
E lentamente tutto sembra più leggero.`,
'🌧️'
);

}else{

badge.innerText='11–12 anni • Direzione';
title.innerText='Scegli una domanda';
subtitle.innerText='Una micro-riflessione su identità, possibilità e direzione.';

bigImage.innerText='🧭 🌌';

activityText.innerHTML=`
<strong>${name}</strong>, l’atlante delle possibilità non dà risposte immediate.<br><br>
Fa domande importanti.
`;

addOption(
'🧭 Chi sto diventando?',
`
Non serve avere subito una risposta.<br><br>
Alcune domande servono solo a guardarsi meglio.`,
'🧭'
);

addOption(
'🌌 Cosa mi accende?',
`
A volte la direzione nasce da ciò che fa dimenticare la paura di provare.`,
'🌌'
);

addOption(
'📖 Cosa voglio capire?',
`
La curiosità è una bussola silenziosa.<br><br>
Ti porta dove qualcosa dentro si sveglia davvero.`,
'📖'
);

}
</script>

</body>
</html>
