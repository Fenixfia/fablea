<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Entra nella storia</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
padding:24px;
font-family:'Nunito',sans-serif;
background:
radial-gradient(circle at top left,#fff1d8 0%,transparent 30%),
radial-gradient(circle at bottom right,#e7dcff 0%,transparent 34%),
linear-gradient(135deg,#f8f1e8 0%,#ece4ea 45%,#d9ddea 100%);
display:flex;
justify-content:center;
align-items:center;
color:#352f36;
}

.card{
width:92%;
max-width:920px;
padding:52px 42px;
border-radius:42px;
background:rgba(255,251,247,.74);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.6);
box-shadow:0 24px 80px rgba(70,60,50,.12);
text-align:center;
}

.badge{
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#9f8a76;
margin-bottom:18px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:54px;
font-weight:600;
margin-bottom:14px;
}

.subtitle{
font-size:18px;
line-height:1.6;
color:#756c70;
max-width:680px;
margin:0 auto 32px;
}

.visual-zone{
min-height:300px;
border-radius:36px;
margin:28px auto;
background:
radial-gradient(circle at 50% 35%,#fff8d8 0%,transparent 24%),
radial-gradient(circle at 20% 80%,#ffd9be 0%,transparent 24%),
linear-gradient(135deg,#efe5ff,#f9e7b6);
box-shadow:inset 0 0 80px rgba(255,255,255,.62);
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
}

.big-image{
font-size:96px;
animation:float 4s ease-in-out infinite;
z-index:2;
}

@keyframes float{
0%{transform:translateY(0) scale(1)}
50%{transform:translateY(-8px) scale(1.04)}
100%{transform:translateY(0) scale(1)}
}

.glow{
position:absolute;
width:160px;
height:160px;
border-radius:50%;
background:rgba(255,244,190,.55);
filter:blur(18px);
animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{
0%{transform:scale(.9);opacity:.55}
50%{transform:scale(1.15);opacity:.9}
100%{transform:scale(.9);opacity:.55}
}

.stars{
position:absolute;
inset:0;
}

.star{
position:absolute;
font-size:24px;
opacity:.7;
animation:twinkle 3s infinite alternate;
}

.star:nth-child(1){top:18%;left:18%}
.star:nth-child(2){top:26%;right:20%;animation-delay:.5s}
.star:nth-child(3){bottom:22%;left:24%;animation-delay:1s}
.star:nth-child(4){bottom:28%;right:24%;animation-delay:1.5s}

@keyframes twinkle{
from{opacity:.3;transform:scale(.8)}
to{opacity:1;transform:scale(1.15)}
}

.activity{
max-width:700px;
margin:0 auto;
font-size:22px;
line-height:1.7;
color:#4d4550;
}

.activity strong{
color:#342f38;
}

.options{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:28px;
}

.option{
padding:20px 16px;
border-radius:26px;
background:rgba(255,255,255,.50);
border:1px solid rgba(80,65,55,.10);
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.option:hover{
transform:translateY(-3px);
background:rgba(255,255,255,.72);
}

.result{
margin-top:26px;
padding:22px;
border-radius:26px;
background:rgba(255,255,255,.46);
font-size:20px;
line-height:1.6;
color:#5f575c;
display:none;
}

.actions{
margin-top:40px;
display:flex;
gap:16px;
justify-content:center;
flex-wrap:wrap;
}

.button{
padding:15px 28px;
border-radius:999px;
text-decoration:none;
font-size:16px;
font-weight:700;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#322d34;
box-shadow:0 12px 30px rgba(231,200,112,.25);
border:0;
cursor:pointer;
}

.secondary{
background:rgba(255,255,255,.55);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
box-shadow:none;
}

@media(max-width:700px){
.card{padding:40px 22px;border-radius:30px}
h1{font-size:38px}
.visual-zone{min-height:260px}
.big-image{font-size:82px}
.activity{font-size:19px}
.options{grid-template-columns:1fr}
.button{width:100%}
}
</style>
</head>

<body>

<main class="card">

<div class="badge" id="badge">FABLEA activity</div>

<h1 id="title">Entra nella storia</h1>

<div class="subtitle" id="subtitle">
Una piccola esperienza per ascoltare, immaginare e partecipare senza fretta.
</div>

<div class="visual-zone" id="visualZone">
<div class="glow"></div>
<div class="stars">
<div class="star">✨</div>
<div class="star">⭐</div>
<div class="star">✨</div>
<div class="star">⭐</div>
</div>
<div class="big-image" id="bigImage">🌙</div>
</div>

<div class="activity" id="activityText"></div>

<div class="options" id="options"></div>

<div class="result" id="resultBox"></div>

<div class="actions">
<a class="button" href="/story-player.html">Ascolta la storia</a>
<a class="button secondary" href="/story-result.html">Torna alla storia</a>
<a class="button secondary" href="/story.html">Nuova storia</a>
<a class="button secondary" href="/index.html">Home</a>
</div>

</main>

<script>
const savedData = localStorage.getItem('fableaStoryData');

const data = savedData ? JSON.parse(savedData) : {
name:'il piccolo protagonista',
age:'5-7',
mood:'Tranquilla',
theme:'Foresta magica'
};

const name = data.name || 'il piccolo protagonista';
const age = data.age || '5-7';
const mood = data.mood || 'Tranquilla';
const theme = data.theme || 'Foresta magica';

const badge = document.getElementById('badge');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const bigImage = document.getElementById('bigImage');
const activityText = document.getElementById('activityText');
const options = document.getElementById('options');
const resultBox = document.getElementById('resultBox');

function showResult(text, image){
resultBox.style.display='block';
resultBox.innerText=text;
if(image){ bigImage.innerText=image; }
}

function addOption(label, text, image){
const div=document.createElement('div');
div.className='option';
div.innerText=label;
div.onclick=function(){showResult(text,image)};
options.appendChild(div);
}

if(age === '2-4'){

badge.innerText='2–4 anni • Meraviglia';
title.innerText='Guarda, respira, immagina';
subtitle.innerText='Una scena grande e calma per aiutare il bambino a concentrarsi senza iperstimolazione.';
bigImage.innerText='🌙 🧸';

activityText.innerHTML = `
<strong>${name}</strong>, guarda la luna morbida.<br>
Facciamo piano piano.<br><br>
Tocca una figura e guarda cosa succede.
`;

addOption('🌙 Luna', 'La luna brilla piano. Inspira… espira… tutto è morbido.', '🌙');
addOption('🧸 Orsetto', 'L’orsetto si avvicina. È caldo, dolce e resta vicino a te.', '🧸');
addOption('✨ Stellina', 'La stellina fa una piccola luce. Non corre. Aspetta con te.', '✨');

} else if(age === '5-7'){

badge.innerText='5–7 anni • Esplorazione';
title.innerText='Scegli il prossimo passo';
subtitle.innerText='Per primi lettori: frasi semplici, scelte chiare e immagini che aiutano la comprensione.';
bigImage.innerText='🗺️ 🦊';

activityText.innerHTML = `
<strong>${name}</strong>, la mappa luminosa mostra tre strade.<br>
Leggi piano e scegli dove andare.
`;

addOption('🌲 Bosco', 'La strada del bosco è silenziosa. La volpe ti guida tra foglie luminose.', '🌲🦊');
addOption('🌊 Mare', 'La strada del mare respira piano. Ogni onda dice una parola gentile.', '🌊⭐');
addOption('⭐ Stella', 'La strada della stella sale in alto. Da lì il mondo sembra piccolo e dolce.', '⭐☁️');

} else if(age === '8-10'){

badge.innerText='8–10 anni • Identità';
title.innerText='Dai un nome all’emozione';
subtitle.innerText='Una pausa narrativa per riconoscere quello che si sente dentro.';
bigImage.innerText='💛 🌉';

activityText.innerHTML = `
<strong>${name}</strong>, prima di attraversare il ponte, scegli quale luce senti più vicina oggi.
`;

addOption('💛 Fiducia', 'La fiducia non cancella i dubbi. Ti aiuta a fare un passo anche quando non sai tutto.', '💛');
addOption('🛡️ Coraggio', 'Il coraggio non deve essere grande. A volte è solo restare gentili anche quando è difficile.', '🛡️');
addOption('🌧️ Calma', 'La calma arriva piano. Non forza nulla. Si siede accanto a te e aspetta.', '🌧️');

} else {

badge.innerText='11–12 anni • Direzione';
title.innerText='Scegli una direzione';
subtitle.innerText='Una micro-riflessione più matura su identità, possibilità e futuro.';
bigImage.innerText='🧭 🌌';

activityText.innerHTML = `
<strong>${name}</strong>, l’atlante è aperto davanti a te.<br>
Non devi decidere tutto. Scegli solo quale domanda vuoi portare con te.
`;

addOption('🧭 Chi sto diventando?', 'È una domanda grande. Non richiede una risposta subito. Richiede attenzione.', '🧭');
addOption('🌌 Cosa mi accende?', 'A volte la direzione nasce da ciò che ti fa perdere la paura di provarci.', '🌌');
addOption('📖 Cosa voglio capire?', 'La curiosità è una bussola silenziosa. Ti porta dove qualcosa dentro si sveglia.', '📖');

}
</script>

</body>
</html>
