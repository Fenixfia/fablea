<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Voce narrante</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
width:100%;
height:100%;
}

body{
height:100vh;
overflow:hidden;
font-family:'Nunito',sans-serif;
background:#15121d;
color:white;
}

.stage{
position:relative;
width:100%;
height:100vh;
padding:22px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.ambient{
position:absolute;
inset:0;
background:
radial-gradient(circle at 50% 28%,rgba(255,232,171,.28),transparent 24%),
radial-gradient(circle at 20% 80%,rgba(225,203,255,.22),transparent 30%),
linear-gradient(180deg,#171421 0%,#231e31 48%,#100f16 100%);
transition:background 1.2s ease;
}

.ambient.forest{
background:
radial-gradient(circle at 50% 30%,rgba(255,232,171,.26),transparent 24%),
radial-gradient(circle at 20% 80%,rgba(117,178,133,.20),transparent 32%),
linear-gradient(180deg,#151b19 0%,#243326 50%,#101510 100%);
}

.ambient.ocean{
background:
radial-gradient(circle at 50% 30%,rgba(255,232,171,.22),transparent 24%),
radial-gradient(circle at 20% 80%,rgba(114,188,219,.24),transparent 34%),
linear-gradient(180deg,#121b2a 0%,#183448 50%,#0d1119 100%);
}

.ambient.sky{
background:
radial-gradient(circle at 50% 30%,rgba(255,232,171,.24),transparent 24%),
radial-gradient(circle at 20% 80%,rgba(218,204,255,.30),transparent 34%),
linear-gradient(180deg,#1d1830 0%,#30284b 50%,#12101a 100%);
}

.ambient.bridge{
background:
radial-gradient(circle at 50% 30%,rgba(255,232,171,.24),transparent 24%),
radial-gradient(circle at 20% 80%,rgba(255,210,180,.20),transparent 34%),
linear-gradient(180deg,#1b1820 0%,#33283a 50%,#111016 100%);
}

.ambient.space{
background:
radial-gradient(circle at 50% 30%,rgba(255,232,171,.20),transparent 24%),
radial-gradient(circle at 20% 80%,rgba(130,120,255,.24),transparent 34%),
linear-gradient(180deg,#090915 0%,#151535 52%,#07070d 100%);
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
opacity:.45;
animation:twinkle 4s infinite alternate;
}

.star:nth-child(2){top:12%;left:18%}
.star:nth-child(3){top:24%;left:76%;animation-delay:.6s}
.star:nth-child(4){top:68%;left:82%;animation-delay:1.1s}
.star:nth-child(5){top:74%;left:14%;animation-delay:.2s}
.star:nth-child(6){top:42%;left:88%;animation-delay:1.5s}
.star:nth-child(7){top:58%;left:10%;animation-delay:.9s}

@keyframes twinkle{
from{opacity:.18;transform:scale(.8)}
to{opacity:.75;transform:scale(1.25)}
}

.glow{
position:absolute;
width:520px;
height:520px;
border-radius:50%;
background:radial-gradient(circle,rgba(255,231,170,.22),transparent 70%);
filter:blur(12px);
animation:pulse 8s infinite ease-in-out;
}

@keyframes pulse{
0%{transform:scale(.95);opacity:.45}
50%{transform:scale(1.12);opacity:.72}
100%{transform:scale(.95);opacity:.45}
}

.panel{
position:relative;
z-index:2;
width:min(900px,94vw);
height:min(760px,92vh);
padding:34px;
border-radius:42px;
background:rgba(255,255,255,.085);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.13);
box-shadow:0 26px 90px rgba(0,0,0,.38);
display:flex;
flex-direction:column;
justify-content:space-between;
text-align:center;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.back{
display:inline-flex;
align-items:center;
justify-content:center;
padding:11px 16px;
border-radius:999px;
background:rgba(255,255,255,.10);
border:1px solid rgba(255,255,255,.13);
color:white;
font-size:14px;
font-weight:900;
text-decoration:none;
}

.badge{
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#d8c7a4;
}

.visual{
font-size:88px;
margin:18px 0 14px;
animation:float 5s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0) scale(1)}
50%{transform:translateY(-7px) scale(1.035)}
100%{transform:translateY(0) scale(1)}
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:54px;
line-height:1.05;
font-weight:600;
margin-bottom:12px;
}

.subtitle{
font-size:17px;
line-height:1.65;
color:rgba(255,255,255,.68);
max-width:680px;
margin:0 auto 16px;
}

.textbox{
margin:18px auto;
width:100%;
max-width:720px;
min-height:190px;
padding:28px;
border-radius:32px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.09);
display:flex;
align-items:center;
justify-content:center;
}

.current-text{
font-family:'Cormorant Garamond',serif;
font-size:34px;
line-height:1.55;
color:rgba(255,255,255,.86);
transition:opacity .5s ease;
}

.current-text.fade{
opacity:.18;
}

.audio-box{
padding:18px;
border-radius:28px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.09);
}

.status{
font-size:15px;
line-height:1.5;
color:#d8c7a4;
margin-bottom:12px;
white-space:pre-line;
}

audio{
width:100%;
margin:10px 0 4px;
}

.controls{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
margin-top:14px;
}

.button{
padding:14px 24px;
border-radius:999px;
border:0;
cursor:pointer;
font-size:15px;
font-weight:900;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#2c2532;
box-shadow:0 10px 24px rgba(231,200,112,.22);
text-decoration:none;
}

.button:disabled{
opacity:.65;
cursor:not-allowed;
}

.secondary{
background:rgba(255,255,255,.10);
border:1px solid rgba(255,255,255,.13);
color:white;
box-shadow:none;
}

.bottom{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
}

.small{
font-size:13px;
padding:11px 16px;
}

.progress{
height:7px;
width:100%;
border-radius:999px;
background:rgba(255,255,255,.10);
overflow:hidden;
margin-top:14px;
}

.progress-fill{
height:100%;
width:0%;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
transition:width .25s linear;
}

@media(max-width:740px){
.stage{padding:12px}
.panel{
height:96vh;
padding:20px 16px;
border-radius:30px;
}
.top{justify-content:center;flex-wrap:wrap}
.badge{width:100%;order:-1;margin-bottom:4px}
.visual{font-size:64px;margin:12px 0}
h1{font-size:36px}
.subtitle{font-size:14px}
.textbox{min-height:185px;padding:20px}
.current-text{font-size:27px}
.button{width:100%}
.bottom .back{width:100%}
}
</style>
</head>

<body>

<div class="stage">

<div class="ambient" id="ambient"></div>
<div class="glow"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>

<main class="panel">

<div>
<div class="top">
<a class="back" href="/story-result.html">← Storia</a>
<div class="badge">Voce narrante</div>
<a class="back" href="/child-hub.html">Mondo</a>
</div>

<div class="visual" id="storyIcon">🌙</div>

<h1 id="storyTitle">La storia della sera</h1>

<div class="subtitle" id="storySubtitle">
Una voce calda accompagna il racconto, mentre il mondo cambia lentamente.
</div>

<div class="textbox">
<div class="current-text" id="currentText">
Premi “Genera voce” per iniziare.
</div>
</div>
</div>

<div class="audio-box">

<div class="status" id="audioStatus">
Pronto per generare la voce narrante.
</div>

<audio id="storyAudio" controls></audio>

<div class="progress">
<div class="progress-fill" id="progressFill"></div>
</div>

<div class="controls">
<button class="button" id="generateVoice">Genera voce</button>
<button class="button secondary" id="pauseAudio">Pausa</button>
<button class="button secondary" id="restartAudio">Ricomincia</button>
<button class="button secondary" id="nextText">Testo avanti</button>
</div>

</div>

<div class="bottom">
<a class="back small" href="/activity.html">Entra nella storia</a>
<a class="back small" href="/manualita.html">Crea con le mani</a>
<a class="back small" href="/story.html">Nuova esperienza</a>
<a class="back small" href="/library.html">Libreria</a>
</div>

</main>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const savedStory = JSON.parse(localStorage.getItem("fableaCurrentStory") || "{}");

const fallbackText = `Cesare trovò una mappa luminosa nascosta dentro un vecchio libro.

Ogni stella sulla mappa brillava lentamente nel buio.

Quando la toccò, la stanza si riempì di luce dorata.

Una piccola voce sussurrò: benvenuto nel mondo di FABLEA.`;

const title = savedStory.title || "La storia della sera";
const subtitle = savedStory.subtitle || "Una nuova esperienza narrativa FABLEA.";
const text = savedStory.text || fallbackText;
const icon = savedStory.icon || "🌙";

const audio = document.getElementById("storyAudio");
const generateBtn = document.getElementById("generateVoice");
const pauseBtn = document.getElementById("pauseAudio");
const restartBtn = document.getElementById("restartAudio");
const nextTextBtn = document.getElementById("nextText");
const statusText = document.getElementById("audioStatus");
const currentText = document.getElementById("currentText");
const ambient = document.getElementById("ambient");
const progressFill = document.getElementById("progressFill");

document.getElementById("storyTitle").innerText = title;
document.getElementById("storySubtitle").innerText = subtitle;
document.getElementById("storyIcon").innerText = icon;

const chunks = text
.split(/\n\n|(?<=\.)\s+/)
.map(item => item.trim())
.filter(item => item.length > 8);

let currentChunk = 0;
let currentAudioUrl = null;

function setAmbient(){
const lower = (title + " " + subtitle + " " + text).toLowerCase();

ambient.className = "ambient";

if(lower.includes("bosco") || lower.includes("lupo") || lower.includes("volpe")){
ambient.classList.add("forest");
}else if(lower.includes("mare") || lower.includes("oceano") || lower.includes("onda")){
ambient.classList.add("ocean");
}else if(lower.includes("nuvol") || lower.includes("principessa") || lower.includes("cielo")){
ambient.classList.add("sky");
}else if(lower.includes("ponte") || lower.includes("scelte")){
ambient.classList.add("bridge");
}else if(lower.includes("atlante") || lower.includes("stella") || lower.includes("spazio")){
ambient.classList.add("space");
}
}

function showChunk(index){
if(!chunks.length){
currentText.innerText = "La storia è pronta.";
return;
}

currentChunk = Math.max(0, Math.min(index, chunks.length - 1));

currentText.classList.add("fade");

setTimeout(() => {
currentText.innerText = chunks[currentChunk];
currentText.classList.remove("fade");
}, 220);
}

function advanceText(){
showChunk(currentChunk + 1);
}

setAmbient();
showChunk(0);

nextTextBtn.addEventListener("click", advanceText);

generateBtn.addEventListener("click", async () => {

try {

generateBtn.disabled = true;
generateBtn.innerText = "Generazione...";
statusText.innerText = "Creazione della voce narrante...";

const response = await fetch("/api/tts", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
text: text
})
});

if (!response.ok) {
const errorText = await response.text();
statusText.innerText = "ERRORE API:\n" + errorText;
throw new Error(errorText);
}

const blob = await response.blob();

if (currentAudioUrl) {
URL.revokeObjectURL(currentAudioUrl);
}

currentAudioUrl = URL.createObjectURL(blob);

audio.src = currentAudioUrl;

await audio.play();

statusText.innerText = "La voce narrante sta raccontando la storia.";
generateBtn.innerText = "Voce pronta";

} catch (error) {

console.error(error);

if (!statusText.innerText.includes("ERRORE API")) {
statusText.innerText = "Errore audio:\n" + error.message;
}

generateBtn.innerText = "Errore audio";

} finally {

generateBtn.disabled = false;

}

});

pauseBtn.addEventListener("click", () => {

if (!audio.src) {
statusText.innerText = "Genera prima la voce narrante.";
return;
}

if (audio.paused) {
audio.play();
pauseBtn.innerText = "Pausa";
statusText.innerText = "La voce narrante continua.";
} else {
audio.pause();
pauseBtn.innerText = "Riprendi";
statusText.innerText = "Favola in pausa.";
}

});

restartBtn.addEventListener("click", () => {

if (!audio.src) {
statusText.innerText = "Genera prima la voce narrante.";
return;
}

audio.currentTime = 0;
audio.play();
pauseBtn.innerText = "Pausa";
showChunk(0);
statusText.innerText = "La storia ricomincia lentamente.";

});

audio.addEventListener("timeupdate", () => {

if(!audio.duration) return;

const percent = (audio.currentTime / audio.duration) * 100;
progressFill.style.width = percent + "%";

if(chunks.length > 1){
const estimatedIndex = Math.floor((audio.currentTime / audio.duration) * chunks.length);
if(estimatedIndex !== currentChunk && estimatedIndex < chunks.length){
showChunk(estimatedIndex);
}
}

});

audio.addEventListener("ended", () => {
statusText.innerText = "La storia è terminata dolcemente. Puoi continuare domani.";
pauseBtn.innerText = "Pausa";
progressFill.style.width = "100%";
showChunk(chunks.length - 1);
});

});
</script>

</body>
</html>
