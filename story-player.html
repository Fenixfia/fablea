<script>
document.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("storyAudio");
  const generateBtn = document.getElementById("generateVoice");
  const pauseBtn = document.getElementById("pauseAudio");
  const restartBtn = document.getElementById("restartAudio");
  const statusText = document.getElementById("audioStatus");

  generateBtn.addEventListener("click", async () => {

    try {

      generateBtn.innerText = "Generazione...";
      statusText.innerText = "Creazione voce narrante...";

      const response = await fetch("/api/tts", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: `
          Cesare trovò una mappa luminosa nascosta dentro un vecchio libro.
          Ogni stella sulla mappa brillava lentamente nel buio.
          Quando la toccò, la stanza si riempì di luce dorata.
          Una piccola voce sussurrò:
          Benvenuto nel mondo di FABLEA.
          `
        })
      });

      if (!response.ok) {
        throw new Error("Errore generazione audio");
      }

      const blob = await response.blob();

      const audioUrl = URL.createObjectURL(blob);

      audio.src = audioUrl;

      await audio.play();

      statusText.innerText = "Voce narrante pronta";
      generateBtn.innerText = "Voce pronta";

    } catch (error) {

      console.error(error);

      statusText.innerText =
        "Audio non disponibile. Controlla API, deploy o crediti ElevenLabs.";

      generateBtn.innerText = "Errore audio";
    }
  });

  pauseBtn.addEventListener("click", () => {

    if (!audio.src) return;

    if (audio.paused) {
      audio.play();
      pauseBtn.innerText = "Pausa";
    } else {
      audio.pause();
      pauseBtn.innerText = "Riprendi";
    }
  });

  restartBtn.addEventListener("click", () => {

    if (!audio.src) return;

    audio.currentTime = 0;
    audio.play();

    pauseBtn.innerText = "Pausa";
  });

});
</script>
