<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=/story-result.html">
<title>FABLEA | Reindirizzamento</title>
<style>
*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f8f1e8,#d9ddea);color:#352f36}.card{max-width:560px;padding:32px;border-radius:28px;background:rgba(255,251,247,.82);box-shadow:0 18px 54px rgba(70,60,50,.14);text-align:center}a{color:#6b5532;font-weight:800}
</style>
<script>
(function(){
try{
const story = JSON.parse(localStorage.getItem('fableaCurrentStory') || '{}');
if(story && story.text){ localStorage.setItem('fableaReopenStory','true'); }
}catch(_){ }
window.location.replace('/story-result.html');
})();
</script>
</head>
<body>
<main class="card">
<h1>Ti porto al libro FABLEA…</h1>
<p>La voce narrante ora vive nel libro principale. Se il passaggio non parte, <a href="/story-result.html">apri la storia</a>.</p>
</main>
</body>
</html>
