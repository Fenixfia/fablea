<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Nuova esperienza</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:24px;
font-family:'Nunito',sans-serif;
background:
radial-gradient(circle at top left,#fff1d8 0%,transparent 30%),
radial-gradient(circle at bottom right,#e7dcff 0%,transparent 34%),
linear-gradient(135deg,#f8f1e8 0%,#ece4ea 45%,#d9ddea 100%);
color:#332d35;
}

.card{
width:92%;
max-width:840px;
padding:52px 42px;
border-radius:42px;
background:rgba(255,250,245,.72);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.58);
box-shadow:0 24px 80px rgba(80,65,55,.15);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
flex-wrap:wrap;
margin-bottom:30px;
}

.back{
display:inline-flex;
align-items:center;
justify-content:center;
padding:12px 17px;
border-radius:999px;
background:rgba(255,255,255,.58);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
font-size:14px;
font-weight:900;
text-decoration:none;
}

.badge{
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#9c8774;
}

.hero{
text-align:center;
margin-bottom:34px;
}

.avatar{
width:86px;
height:86px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
background:linear-gradient(135deg,#f8e3aa,#e7dcff);
margin:0 auto 18px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:54px;
font-weight:600;
line-height:1.08;
margin-bottom:14px;
}

.intro{
font-size:18px;
line-height:1.7;
color:#6d6668;
max-width:700px;
margin:0 auto;
}

.profile-note{
margin:26px auto 34px;
padding:18px 22px;
border-radius:26px;
background:rgba(255,255,255,.48);
border:1px solid rgba(80,65,55,.08);
font-size:15px;
line-height:1.6;
color:#7b706c;
text-align:center;
max-width:700px;
}

label{
display:block;
font-size:15px;
font-weight:900;
color:#6d5f57;
margin:20px 0 9px;
}

select{
width:100%;
height:60px;
border-radius:20px;
border:1px solid rgba(80,65,55,.14);
background:rgba(255,255,255,.74);
padding:0 18px;
font-size:17px;
font-family:'Nunito',sans-serif;
font-weight:700;
color:#332d35;
outline:none;
}

.theme-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:12px;
}

.theme{
padding:17px 12px;
border-radius:22px;
background:rgba(255,255,255,.50);
border:1px solid rgba(80,65,55,.10);
text-align:center;
font-size:15px;
font-weight:900;
cursor:pointer;
transition:.25s;
}

.theme.active{
background:linear-gradient(135deg,#f8e3aa,#e7c870);
box-shadow:0 12px 26px rgba(231,200,112,.20);
}

button.main{
width:100%;
height:66px;
margin-top:34px;
border:0;
border-radius:999px;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#332d35;
font-size:19px;
font-weight:900;
box-shadow:0 14px 28px rgba(181,145,73,.18);
cursor:pointer;
}

.empty{
text-align:center;
padding:34px 28px;
border-radius:32px;
background:rgba(255,255,255,.50);
border:1px solid rgba(80,65,55,.10);
}

.empty h2{
font-family:'Cormorant Garamond',serif;
font-size:38px;
font-weight:600;
margin-bottom:12px;
}

.empty p{
font-size:17px;
line-height:1.7;
color:#756c70;
margin-bottom:22px;
}

.empty a{
display:inline-flex;
justify-content:center;
align-items:center;
padding:15px 26px;
border-radius:999px;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#332d35;
font-size:16px;
font-weight:900;
text-decoration:none;
}

.nav{
display:flex;
justify-content:center;
gap:18px;
margin-top:26px;
font-size:15px;
flex-wrap:wrap;
}

.nav a{
color:#8f8078;
text-decoration:none;
font-weight:800;
}

@media(max-width:760px){
body{padding:18px}
.card{padding:40px 22px;border-radius:32px}
h1{font-size:40px}
.intro{font-size:16px}
.theme-grid{grid-template-columns:1fr 1fr}
.top{justify-content:center}
.badge{text-align:center}
}
</style>
</head>

<body>

<main class="card">

<div class="top">
<a class="back" href="/child-hub.html">← Torna al mondo</a>
<div class="badge">Nuova esperienza</div>
<a class="back" href="/onboarding.html">Profili</a>
</div>

<div id="content"></div>

</main>

<script>
function escapeHTML(value){
return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function getProfiles(){
return JSON.parse(localStorage.getItem('fableaChildProfiles') || '[]');
}

function getSelectedProfile(){
const profiles = getProfiles();
const selectedId = localStorage.getItem('fableaSelectedChildId');

if(!profiles.length) return null;

return profiles.find(profile => profile.id === selectedId) || profiles[0];
}

function avatarFor(age){
if(age === '2-4') return '🌙';
if(age === '5-7') return '🦊';
if(age === '8-10') return '💛';
if(age === '11-12') return '🧭';
return '✨';
}

function ageLabel(value){
if(value === '2-4') return 'Meraviglia';
if(value === '5-7') return 'Esplorazione';
if(value === '8-10') return 'Identità';
if(value === '11-12') return 'Direzione';
return 'FABLEA';
}

let selectedTheme = '';
const presetData = JSON.parse(localStorage.getItem('fableaStoryData') || '{}');

function cleanInterest(value){
return value.replace(/[^\p{L}\p{N}\s]/gu,'').trim();
}

function setTheme(value){
selectedTheme = value;
document.querySelectorAll('.theme').forEach(item=>{
item.classList.remove('active');
if(item.dataset.theme === value){
item.classList.add('active');
}
});
}

function buildThemes(profile){
const base = [
'Foresta magica',
'Il lupo cattivo gentile',
'Mare e stelle',
'Animali parlanti',
'Dinosauri gentili',
'Spazio e pianeti',
'Principesse coraggiose',
'Regni della luna',
'Manualità e fantasia'
];

const interests = profile.interests && profile.interests.length
? profile.interests.map(cleanInterest).filter(Boolean)
: [];

const merged = [...interests, ...base];

return [...new Set(merged)].slice(0,9);
}

function createStory(){

const profile = getSelectedProfile();

if(!profile){
window.location.href='/onboarding.html';
return;
}

const data = {
name:profile.name,
age:profile.age,
experience:document.getElementById('experienceType').value,
mood:document.getElementById('childMood').value,
theme:selectedTheme || 'Foresta magica',
interests:profile.interests || [],
support:profile.support || '',
duration:profile.duration || ''
};

localStorage.setItem('fableaStoryData', JSON.stringify(data));

window.location.href='/story-result.html';
}

function render(){
const profile = getSelectedProfile();
const content = document.getElementById('content');

if(!profile){
content.innerHTML = `
<div class="empty">
<h2>Nessun esploratore selezionato.</h2>
<p>
Scegli o crea prima un profilo bambino. Poi FABLEA potrà costruire un’esperienza adatta al suo piccolo mondo.
</p>
<a href="/onboarding.html">Scegli profilo</a>
</div>
`;
return;
}

localStorage.setItem('fableaSelectedChildId', profile.id);

const themes = buildThemes(profile);
selectedTheme = presetData.theme || themes[0];

if(presetData.quickStart && presetData.name && presetData.age){
const cleanPreset = {...presetData};
delete cleanPreset.quickStart;
localStorage.setItem('fableaStoryData', JSON.stringify(cleanPreset));
window.location.href = '/story-result.html';
return;
}

content.innerHTML = `
<section class="hero">
<div class="avatar">${avatarFor(profile.age)}</div>
<h1>Che esperienza viviamo oggi con ${escapeHTML(profile.name)}?</h1>
<div class="intro">
Scegli il ritmo della giornata, il mondo da esplorare e il tipo di esperienza. FABLEA adatterà voce, immagini e racconto alla fascia ${escapeHTML(ageLabel(profile.age))}.
</div>
</section>

<div class="profile-note">
Il mondo di ${escapeHTML(profile.name)} parte dai suoi interessi e cresce nel tempo: ${profile.interests && profile.interests.length ? profile.interests.map(escapeHTML).join(', ') : 'immaginazione, calma e scoperta'}.
</div>

<label>Tipo di esperienza</label>
<select id="experienceType">
<option ${presetData.experience === 'Avventura immaginativa' ? 'selected' : ''}>Avventura immaginativa</option>
<option ${presetData.experience === 'Storia della sera' ? 'selected' : ''}>Storia della sera</option>
<option ${presetData.experience === 'Storia sulle emozioni' ? 'selected' : ''}>Storia sulle emozioni</option>
<option ${presetData.experience === 'Storia educativa soft' ? 'selected' : ''}>Storia educativa soft</option>
<option ${presetData.experience === 'Mini racconto rilassante' ? 'selected' : ''}>Mini racconto rilassante</option>
<option ${presetData.experience === 'Missione creativa' ? 'selected' : ''}>Missione creativa</option>
<option ${presetData.experience === 'Scoperta del giorno' ? 'selected' : ''}>Scoperta del giorno</option>
</select>

<label>Com’è il momento di oggi?</label>
<select id="childMood">
<option ${presetData.mood === 'Curiosa' ? 'selected' : ''}>Curiosa</option>
<option ${presetData.mood === 'Tranquilla' ? 'selected' : ''}>Tranquilla</option>
<option ${presetData.mood === 'Felice' ? 'selected' : ''}>Felice</option>
<option ${presetData.mood === 'Stancante' ? 'selected' : ''}>Stancante</option>
<option ${presetData.mood === 'Un po’ difficile' ? 'selected' : ''}>Un po’ difficile</option>
<option ${presetData.mood === 'Piena di energia' ? 'selected' : ''}>Piena di energia</option>
<option ${presetData.mood === 'Ha avuto paura di qualcosa' ? 'selected' : ''}>Ha avuto paura di qualcosa</option>
<option ${presetData.mood === 'Un po’ arrabbiata' ? 'selected' : ''}>Un po’ arrabbiata</option>
</select>

<label>Quale mondo apriamo?</label>
<div class="theme-grid">
${themes.map((theme,index)=>`
<div class="theme ${theme === selectedTheme ? 'active' : ''}" data-theme="${escapeHTML(theme)}" onclick="setTheme(this.dataset.theme)">
${escapeHTML(theme)}
</div>
`).join('')}
</div>

<button class="main" onclick="createStory()">
Apri il mondo
</button>

<div class="nav">
<a href="/child-hub.html">Mondo bambino</a>
<a href="/library.html">Libreria</a>
<a href="/manualita.html">Manualità</a>
<a href="/index.html">Home</a>
</div>
`;
}

render();
</script>

</body>
</html>
