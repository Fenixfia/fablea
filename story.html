<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FABLEA | Nuova esperienza</title><link rel="stylesheet" href="/assets/css/fablea.css"><script src="/assets/js/fablea-ui.js"></script><script src="/assets/js/fablea-grammar.js"></script><script src="/assets/js/fablea-profile.js"></script><script src="/stories-v2/age-2-4.js"></script><script src="/stories-v2/age-5-7.js"></script><script src="/stories-v2/age-8-10.js"></script><script src="/stories-v2/age-11-12.js"></script><script src="/stories-v2/index.js"></script><script src="/assets/js/fablea-story-engine.js"></script></head><body class="fablea-page"><main class="card"><div class="top"><a class="back" href="/child-hub.html">← Torna al mondo</a><div class="badge">Story Creator v2</div></div><div id="content"></div></main><script>
const F=FableaProfile; const profile=F.getSelectedProfile(); const preset=JSON.parse(localStorage.getItem('fableaStoryData')||'{}');
if(!profile) content.innerHTML='<div class="empty"><h2>Nessun profilo</h2><a class="button" href="/onboarding.html">Crea profilo</a></div>'; else {
const moods=['Curiosità e voglia di scoprire','Momento tranquillo','Tanta energia','Una giornata difficile','Un po’ di rabbia','Una piccola paura','Stanchezza','Allegria'];
content.innerHTML=`<section class="hero"><h1>Che cosa cambia oggi per ${F.escapeHTML(profile.name)}?</h1><div class="intro">Il mondo principale resta ${F.escapeHTML(profile.primaryWorld)}: non serve sceglierlo di nuovo.</div></section><label>Tipo di esperienza</label><select id="family"><option value="avventura">Avventura</option><option value="calma-sera">Calma/sera</option><option value="emozioni">Emozioni</option><option value="scoperta">Scoperta</option></select><label>Stato emotivo del momento</label><select id="mood">${moods.map(m=>`<option ${preset.mood===m?'selected':''}>${F.escapeHTML(m)}</option>`).join('')}</select><label>Durata</label><select id="duration"><option ${profile.duration==='Breve'?'selected':''}>Breve</option><option ${profile.duration==='Media'?'selected':''}>Media</option><option ${profile.duration==='Lunga'?'selected':''}>Lunga</option></select><label>Scenario</label><select id="scenarioMode" onchange="alt.style.display=this.value==='other'?'block':'none'"><option value="own">Usa il suo mondo (${F.escapeHTML(profile.primaryWorld)})</option><option value="other">Apriamo un mondo diverso</option></select><select id="alt" style="display:none">${F.WORLDS.filter(w=>w!==profile.primaryWorld).map(w=>`<option>${F.escapeHTML(w)}</option>`).join('')}</select><button class="main" onclick="go()">Apri il mondo</button>`; }
function go(){ const scenario=scenarioMode.value==='other'?alt.value:profile.primaryWorld; localStorage.setItem('fableaStoryData',JSON.stringify({profileId:profile.id,family:family.value,mood:mood.value,duration:duration.value,scenario})); location.href='/story-result.html'; }
</script></body></html>
