name: FABLEA quality

on:
  pull_request:
  push:
    branches:
      - codex/implementa-issue-#9-in-fablea

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: JavaScript syntax
        run: npm run check:js

      - name: Editorial story quality
        id: stories
        continue-on-error: true
        run: npm run check:stories > story-quality.log 2>&1

      - name: Upload editorial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-quality-report
          path: story-quality.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on editorial failure
        if: steps.stories.outcome == 'failure'
        run: exit 1

      - name: Functional flow smoke
        id: smoke
        continue-on-error: true
        run: npm run check:smoke > functional-smoke.log 2>&1

      - name: Upload functional diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-smoke-report
          path: functional-smoke.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on functional failure
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Shared CSS class audit
        id: css
        continue-on-error: true
        run: npm run check:css-classes > css-class-audit.log 2>&1

      - name: Upload CSS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-class-audit-report
          path: css-class-audit.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on CSS failure
        if: steps.css.outcome == 'failure'
        run: exit 1
