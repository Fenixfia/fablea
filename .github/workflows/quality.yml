name: FABLEA quality

on:
  pull_request:
  push:
    branches:
      - codex/implementa-issue-#9-in-fablea

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: JavaScript syntax
        run: npm run check:js

      - name: Editorial story quality
        id: stories
        continue-on-error: true
        run: npm run check:stories > story-quality.log 2>&1

      - name: Upload editorial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-quality-report
          path: story-quality.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on editorial failure
        if: steps.stories.outcome == 'failure'
        run: exit 1

      - name: Functional flow smoke
        id: smoke
        continue-on-error: true
        run: npm run check:smoke > functional-smoke.log 2>&1

      - name: Upload functional diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-smoke-report
          path: functional-smoke.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on functional failure
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: V3 narrative request checks
        id: v3
        continue-on-error: true
        run: npm run check:v3 > v3-narrative.log 2>&1

      - name: Upload V3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-narrative-report
          path: v3-narrative.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on V3 failure
        if: steps.v3.outcome == 'failure'
        run: exit 1

      - name: Shared CSS class audit
        id: css
        continue-on-error: true
        run: npm run check:css-classes > css-class-audit.log 2>&1

      - name: Upload CSS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-class-audit-report
          path: css-class-audit.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on CSS failure
        if: steps.css.outcome == 'failure'
        run: exit 1

      - name: Unified visual system
        id: visual
        continue-on-error: true
        run: npm run check:visual > visual-system.log 2>&1

      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-system-report
          path: visual-system.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on visual-system failure
        if: steps.visual.outcome == 'failure'
        run: exit 1

      - name: Tactile Live Book
        id: page_turn
        continue-on-error: true
        run: npm run check:page-turn > page-turn.log 2>&1

      - name: Upload tactile Live Book diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-turn-report
          path: page-turn.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on tactile Live Book failure
        if: steps.page_turn.outcome == 'failure'
        run: exit 1

      - name: Data security baseline
        id: security
        continue-on-error: true
        run: npm run check:security > security-baseline.log 2>&1

      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-baseline-report
          path: security-baseline.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on security failure
        if: steps.security.outcome == 'failure'
        run: exit 1

      - name: Guided creator and world atlas
        id: creator
        continue-on-error: true
        run: npm run check:creator > guided-creator.log 2>&1

      - name: Upload guided creator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-creator-report
          path: guided-creator.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on guided creator failure
        if: steps.creator.outcome == 'failure'
        run: exit 1

      - name: Child world home and companions
        id: home
        continue-on-error: true
        run: npm run check:home > child-world-home.log 2>&1

      - name: Upload child world home diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-world-home-report
          path: child-world-home.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on child world home failure
        if: steps.home.outcome == 'failure'
        run: exit 1

      - name: Living world coherence
        id: living
        continue-on-error: true
        run: npm run check:living > living-world.log 2>&1

      - name: Upload living world diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-world-report
          path: living-world.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on living world failure
        if: steps.living.outcome == 'failure'
        run: exit 1
