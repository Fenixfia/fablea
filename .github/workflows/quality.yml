name: FABLEA quality

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/implementa-issue-#9-in-fablea

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: JavaScript syntax
        run: npm run check:js

      - name: Editorial story quality
        run: npm run check:stories

      - name: Functional flow smoke
        run: npm run check:smoke

      - name: Shared CSS class audit
        run: npm run check:css-classes
