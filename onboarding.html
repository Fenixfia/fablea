<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Profili</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
padding:28px;
font-family:'Nunito',sans-serif;
background:
radial-gradient(circle at top left,#fff1d8 0%,transparent 30%),
radial-gradient(circle at bottom right,#e7dcff 0%,transparent 34%),
linear-gradient(135deg,#f8f1e8 0%,#ece4ea 45%,#d9ddea 100%);
color:#352f36;
}

.page{
max-width:1180px;
margin:0 auto;
padding:56px 44px;
border-radius:44px;
background:rgba(255,251,247,.76);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.62);
box-shadow:0 24px 80px rgba(70,60,50,.12);
}

.badge{
text-align:center;
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#9f8a76;
margin-bottom:18px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:62px;
line-height:1.05;
text-align:center;
font-weight:600;
margin-bottom:16px;
}

.intro{
text-align:center;
font-size:19px;
line-height:1.7;
color:#756c70;
max-width:760px;
margin:0 auto 46px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:24px;
}

.child{
padding:36px;
border-radius:38px;
background:rgba(255,255,255,.58);
border:1px solid rgba(80,65,55,.10);
box-shadow:0 18px 46px rgba(80,65,55,.08);
transition:.25s ease;
}

.child.active{
background:rgba(255,248,225,.82);
border:1px solid rgba(231,200,112,.60);
box-shadow:0 22px 54px rgba(231,200,112,.22);
}

.avatar{
width:92px;
height:92px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:46px;
background:linear-gradient(135deg,#f8e3aa,#e7dcff);
margin-bottom:22px;
}

.child h2{
font-family:'Cormorant Garamond',serif;
font-size:44px;
font-weight:600;
margin-bottom:8px;
text-transform:capitalize;
}

.meta{
font-size:15px;
font-weight:900;
color:#9f8a76;
margin-bottom:16px;
}

.description{
font-size:17px;
line-height:1.65;
color:#6d6668;
margin-bottom:18px;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:16px;
}

.tag{
font-size:13px;
padding:9px 13px;
border-radius:999px;
background:rgba(255,250,245,.78);
color:#8f8078;
border:1px solid rgba(80,65,55,.08);
font-weight:900;
}

.child-actions{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:28px;
}

.button-small{
padding:14px 19px;
border-radius:999px;
border:0;
cursor:pointer;
font-size:15px;
font-weight:900;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#332d35;
text-decoration:none;
}

.secondary-small{
background:rgba(255,255,255,.58);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
}

.empty{
text-align:center;
padding:46px 32px;
border-radius:38px;
background:rgba(255,255,255,.56);
border:1px solid rgba(80,65,55,.10);
max-width:780px;
margin:0 auto;
}

.empty-icon{
font-size:70px;
margin-bottom:18px;
}

.empty h2{
font-family:'Cormorant Garamond',serif;
font-size:44px;
font-weight:600;
margin-bottom:14px;
}

.empty p{
font-size:18px;
line-height:1.7;
color:#756c70;
margin-bottom:26px;
}

.actions{
display:flex;
gap:16px;
flex-wrap:wrap;
justify-content:center;
margin-top:46px;
}

.button{
display:inline-flex;
justify-content:center;
align-items:center;
padding:16px 30px;
border-radius:999px;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#332d35;
font-size:17px;
font-weight:900;
text-decoration:none;
box-shadow:0 14px 28px rgba(181,145,73,.16);
border:0;
cursor:pointer;
}

.secondary{
background:rgba(255,255,255,.58);
box-shadow:none;
color:#6b6467;
border:1px solid rgba(80,65,55,.10);
}

.footer{
margin-top:36px;
text-align:center;
font-size:14px;
color:#9a8b82;
}

@media(max-width:820px){
body{padding:18px}
.page{padding:42px 22px;border-radius:32px}
h1{font-size:43px}
.intro{font-size:17px}
.grid{grid-template-columns:1fr}
.button,.button-small{width:100%;text-align:center;justify-content:center}
.child{padding:30px 24px}
}
.selected-badge{display:inline-flex;margin-bottom:12px;padding:7px 11px;border-radius:999px;background:#fff2bf;color:#6b5532;font-size:12px;font-weight:900}.text-danger{min-height:44px;padding:10px 4px;border:0;background:transparent;color:#9a5b54;text-decoration:underline;cursor:pointer;font-weight:800}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<body>

<main class="page">

<div class="badge">FABLEA Family</div>

<h1>Chi entra nel mondo FABLEA oggi?</h1>

<div class="intro">
Scegli un piccolo esploratore. Ogni bambino ha il suo mondo, i suoi interessi, le sue storie e il suo modo di immaginare.
</div>

<div id="profileArea"></div>

<div class="actions">
<a class="button" href="/create-child.html">+ Nuovo esploratore</a>
<a class="button secondary" href="/library.html">Libreria</a>
<a class="button secondary" href="/index.html">Home</a>
</div>

<div class="footer">
FABLEA accompagna immaginazione, calma, scoperta e creatività durante tutta la giornata.
</div>

</main>

<script>
const area = document.getElementById('profileArea');
function escapeHTML(value){
return String(value ?? '').replace(/[&<>\"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[char]));
}

function getProfiles(){
return JSON.parse(localStorage.getItem('fableaChildProfiles') || '[]');
}

function saveProfiles(profiles){
localStorage.setItem('fableaChildProfiles', JSON.stringify(profiles));
}

function selectedId(){
return localStorage.getItem('fableaSelectedChildId');
}

function ageLabel(value){
if(value === '2-4') return '2–4 anni • Meraviglia';
if(value === '5-7') return '5–7 anni • Esplorazione';
if(value === '8-10') return '8–10 anni • Identità';
if(value === '11-12') return '11–12 anni • Direzione';
return 'Fascia FABLEA';
}

function avatarFor(age){
if(age === '2-4') return '🌙';
if(age === '5-7') return '🦊';
if(age === '8-10') return '💛';
if(age === '11-12') return '🧭';
return '✨';
}

function profileDescription(profile){
if(profile.age === '2-4') return 'Immagini grandi, parole semplici, rituali morbidi e piccole avventure da vivere insieme.';
if(profile.age === '5-7') return 'Avventure leggibili, mondi da esplorare, prime scelte e curiosità da accendere.';
if(profile.age === '8-10') return 'Storie su emozioni, amicizia, coraggio, autostima e piccole missioni creative.';
if(profile.age === '11-12') return 'Racconti più maturi su identità, sogni, direzione e immaginazione consapevole.';
return 'Un mondo narrativo personale.';
}

function selectChild(id){
localStorage.setItem('fableaSelectedChildId', id);
window.location.href = '/child-hub.html';
}

function quickStory(id){
localStorage.setItem('fableaSelectedChildId', id);
window.location.href = '/story.html';
}

function deleteChild(id){
const ok = confirm('Vuoi eliminare questo profilo dal prototipo?');
if(!ok) return;

const profiles = getProfiles().filter(profile => profile.id !== id);
saveProfiles(profiles);

if(selectedId() === id){
localStorage.removeItem('fableaSelectedChildId');
}

renderProfiles();
}

function renderProfiles(){
const profiles = getProfiles();
const activeId = selectedId();

if(!profiles.length){
area.innerHTML = `
<div class="empty">
<div class="empty-icon">✨</div>
<h2>Nessun esploratore creato.</h2>
<p>
Crea il primo profilo bambino. Da lì FABLEA costruirà un piccolo mondo personale fatto di storie, attività, calma e immaginazione.
</p>
<a class="button" href="/create-child.html">Crea primo esploratore</a>
</div>
`;
return;
}

area.innerHTML = `
<div class="grid">
${profiles.map(profile => {
const safeId = String(profile.id).replace(/[^a-zA-Z0-9_-]/g, '');
const interests = profile.interests && profile.interests.length
? profile.interests.map(item => `<span class="tag">${escapeHTML(item)}</span>`).join('')
: `<span class="tag">✨ Immaginazione</span>`;

const activeClass = profile.id === activeId ? 'active' : '';
const selectedBadge = profile.id === activeId ? '<div class="selected-badge">Profilo selezionato</div>' : '';

return `
<div class="child ${activeClass}">
${selectedBadge}
<div class="avatar">${avatarFor(profile.age)}</div>
<h2>${escapeHTML(profile.name)}</h2>
<div class="meta">${escapeHTML(ageLabel(profile.age))}</div>
<div class="description">${escapeHTML(profileDescription(profile))}</div>

<div class="tags">
${interests}
</div>

<div class="child-actions">
<button class="button-small" onclick="selectChild('${safeId}')">Entra nel mondo</button>
<button class="button-small secondary-small" onclick="quickStory('${safeId}')">Nuova storia</button>
<button class="text-danger" onclick="deleteChild('${safeId}')">Elimina…</button>
</div>
</div>
`;
}).join('')}
</div>
`;
}

renderProfiles();
</script>

</body>
</html>
