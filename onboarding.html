<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FABLEA | Profilo bambino</title><link rel="stylesheet" href="/assets/css/fablea.css"><script src="/assets/js/fablea-ui.js"></script><script src="/assets/js/fablea-grammar.js"></script>
<script src="/assets/js/fablea-profile.js"></script>
<script src="/stories-v2/age-2-4.js"></script>
<script src="/stories-v2/age-5-7.js"></script>
<script src="/stories-v2/age-8-10.js"></script>
<script src="/stories-v2/age-11-12.js"></script>
<script src="/stories-v2/index.js"></script>
<script src="/assets/js/fablea-story-engine.js"></script></head><body class="fablea-page"><main class="card"><div class="badge">Profilo bambino v2</div><h1>Crea il suo mondo una sola volta.</h1><div class="intro">FABLEA userà identità, grammatica, mondo, durata e memoria in tutto il flusso.</div><label>1. Nome</label><input id="name" placeholder="Es. Cesare"><label>2. Fascia d’età</label><select id="age"><option value="2-4">2–4 anni</option><option value="5-7">5–7 anni</option><option value="8-10">8–10 anni</option><option value="11-12">11–12 anni</option></select><label>3. Genere grammaticale</label><select id="gender"><option value="male">Maschio</option><option value="female">Femmina</option><option value="neutral">Forma neutra</option><option value="unspecified">Preferisco non specificarlo</option></select><label>4. Mondo principale</label><select id="primaryWorld"></select><label>5. Interessi secondari</label><div class="grid" id="interests"></div><label>6. Supporto desiderato</label><select id="support"></select><label>7. Durata abituale</label><select id="duration"><option>Breve</option><option>Media</option><option>Lunga</option></select><label>8. Stile narrativo</label><select id="storyStyle"><option value="calm">Calmo</option><option value="adventurous">Avventuroso</option><option value="funny">Divertente</option><option value="mysterious">Misterioso</option><option value="emotional">Emotivo</option></select><button class="button" onclick="save()">Salva e prepara la prima storia</button><div id="summary"></div><div class="nav"><a href="/child-hub.html">Libro vivo</a><a href="/story.html">Crea storia</a><a href="/library.html">Libreria</a></div></main><script>
const F=FableaProfile; let selected=[]; primaryWorld.innerHTML=F.WORLDS.map(w=>`<option>${F.escapeHTML(w)}</option>`).join(''); support.innerHTML=F.SUPPORTS.map(s=>`<option>${F.escapeHTML(s)}</option>`).join(''); interests.innerHTML=F.WORLDS.map(w=>`<div class="choice" data-v="${F.escapeHTML(w)}">${F.escapeHTML(w)}</div>`).join('');
document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{c.classList.toggle('active'); selected=[...document.querySelectorAll('.choice.active')].map(x=>x.dataset.v);});
function save(){ if(!name.value.trim()) return alert('Inserisci il nome.'); const p=F.saveProfile({id:Date.now().toString(),name:name.value.trim(),age:age.value,gender:gender.value,primaryWorld:primaryWorld.value,interests:selected.filter(x=>x!==primaryWorld.value),support:support.value,duration:duration.value,storyStyle:storyStyle.value,createdAt:new Date().toISOString(),schemaVersion:2}); const first=FableaStoryEngine.buildStory(p,{scenario:p.primaryWorld,family:'avventura',mood:'Curiosità e voglia di scoprire',duration:p.duration}); localStorage.setItem('fableaStoryData',JSON.stringify({profileId:p.id,scenario:p.primaryWorld,family:'avventura',mood:'Curiosità e voglia di scoprire',duration:p.duration,firstStory:true})); summary.innerHTML=`<div class="profile-note"><h2>Il mondo di ${F.escapeHTML(p.name)} è pronto</h2><p>Mondo principale: <strong>${F.escapeHTML(p.primaryWorld)}</strong>. Prima storia proposta: <strong>${F.escapeHTML(first.title)}</strong>.</p><a class="button" href="/story-result.html">Apri questa storia</a> <a class="button secondary" href="/child-hub.html">Entra nel Libro vivo</a></div>`; }
</script></body></html>
