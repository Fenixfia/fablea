<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Story</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
padding:24px;
font-family:'Nunito',sans-serif;
background:
radial-gradient(circle at top left,#fff1d8 0%,transparent 30%),
radial-gradient(circle at bottom right,#e7dcff 0%,transparent 34%),
linear-gradient(135deg,#f8f1e8 0%,#ece4ea 45%,#d9ddea 100%);
display:flex;
justify-content:center;
align-items:center;
color:#352f36;
}

.card{
width:92%;
max-width:980px;
padding:54px 44px;
border-radius:42px;
background:rgba(255,251,247,.76);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.62);
box-shadow:0 24px 80px rgba(70,60,50,.12);
}

.badge{
text-align:center;
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#9f8a76;
margin-bottom:16px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:58px;
font-weight:600;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
font-size:17px;
color:#756c70;
margin-bottom:28px;
}

.scene{
margin:28px 0;
padding:28px;
border-radius:34px;
background:rgba(255,255,255,.44);
border:1px solid rgba(80,65,55,.08);
}

.visual{
height:220px;
border-radius:30px;
margin-bottom:22px;
background:
radial-gradient(circle at 50% 35%,#fff6cf 0%,transparent 24%),
radial-gradient(circle at 20% 80%,#f8d9b8 0%,transparent 22%),
linear-gradient(135deg,#e7dcff,#f8e3aa);
box-shadow:inset 0 0 70px rgba(255,255,255,.55);
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
}

.scene h2{
font-family:'Cormorant Garamond',serif;
font-size:36px;
font-weight:600;
margin-bottom:14px;
color:#403943;
}

.scene p{
font-family:'Cormorant Garamond',serif;
font-size:28px;
line-height:1.8;
color:#4d4550;
margin-bottom:18px;
}

.meraviglia .scene p{
font-family:'Nunito',sans-serif;
font-size:28px;
line-height:1.72;
text-align:center;
font-weight:700;
}

.meraviglia .visual{
height:260px;
font-size:86px;
}

.keyword{
background:linear-gradient(135deg,rgba(248,227,170,.7),rgba(231,220,255,.7));
border-radius:12px;
padding:0 6px;
}

.choices{
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
margin-top:22px;
}

.choice{
padding:14px 18px;
border-radius:999px;
background:rgba(255,250,245,.76);
border:1px solid rgba(80,65,55,.10);
font-size:15px;
font-weight:800;
color:#6b6467;
}

.actions{
margin-top:42px;
display:flex;
gap:16px;
justify-content:center;
flex-wrap:wrap;
}

.button{
padding:15px 28px;
border-radius:999px;
border:0;
cursor:pointer;
text-decoration:none;
font-size:16px;
font-weight:800;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#322d34;
box-shadow:0 12px 30px rgba(231,200,112,.25);
}

.secondary{
background:rgba(255,255,255,.55);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
box-shadow:none;
}

.footer{
margin-top:34px;
text-align:center;
font-size:14px;
color:#988a82;
}

@media(max-width:700px){
.card{padding:38px 20px;border-radius:30px}
h1{font-size:38px}
.scene{padding:22px 18px}
.scene h2{font-size:30px}
.scene p{font-size:23px}
.meraviglia .scene p{font-size:24px}
.visual{height:175px;font-size:52px}
.meraviglia .visual{height:220px;font-size:66px}
.button{width:100%;text-align:center}
}
</style>
</head>

<body>

<main class="card meraviglia">

<div class="badge">2–4 anni • Meraviglia</div>

<h1 id="title"></h1>

<div class="subtitle">
Una storia lenta e rassicurante per accompagnare immaginazione e calma.
</div>

<div id="scenes"></div>

<div class="actions">
<a class="button" href="/story-player.html">Ascolta la voce narrante</a>
<a class="button" href="/activity.html">Entra nella storia</a>
<a class="button secondary" href="/story.html">Crea un’altra storia</a>
<a class="button secondary" href="/profile.html">Cambia bambino</a>
<a class="button secondary" href="/library.html">Libreria</a>
</div>

<div class="footer">
Bassa stimolazione • Voce lenta • Immaginazione morbida
</div>

</main>

<script>
const saved = JSON.parse(localStorage.getItem('fableaStoryData'));

const name = saved?.name || 'piccolo esploratore';
const theme = saved?.theme || '';

let title = '';
let scenes = [];

function mark(text){
return text
.replaceAll('lupo','<span class="keyword">lupo</span>')
.replaceAll('luna','<span class="keyword">luna</span>')
.replaceAll('luce','<span class="keyword">luce</span>');
}

if(theme === 'Il lupo cattivo gentile'){

title = `${name} e il lupo dal vocione`;

scenes = [

{
icon:'🌲 🌙 🐺',
title:'Il rumore nel bosco',
text:[
`${name} sentì un rumore nel bosco.`,
`“GROOOOAR...”`,
`Era un grande lupo.`,
`Con un grande vocione.`
],
choices:['Guarda il lupo', 'Respira piano']
},

{
icon:'🐺 🥺 🌙',
title:'Il lupo triste',
text:[
`Ma il lupo non voleva spaventare nessuno.`,
`Aveva solo una voce troppo forte.`,
`Il lupo disse:`,
`“Io volevo solo dire buonasera...”`
],
choices:['Sorridi al lupo', 'Avvicinati piano']
},

{
icon:'✨ 🐺 🤍',
title:'La luce gentile',
text:[
`${name} prese una piccola luce.`,
`La mise vicino al lupo.`,
`Il lupo diventò calmo.`,
`Molto calmo.`
],
choices:['Dai la luce', 'Tocca la stellina']
},

{
icon:'🌙 💤 🐺',
title:'Buonanotte lupo',
text:[
`Il lupo si sdraiò vicino alla luna.`,
`Non sembrava più cattivo.`,
`Sembrava solo stanco.`,
`“Buonanotte piccolo cuore...”`,
`disse piano piano.`
],
choices:['Buonanotte', 'Chiudi gli occhi']
}

];

}else{

title = `${name} e la piccola luce`;

scenes = [

{
icon:'🌙 ✨ 🧸',
title:'La luce',
text:[
`C’era una piccola luce vicino a ${name}.`,
`Faceva piano piano.`,
`Brillava poco. Ma brillava bene.`
],
choices:['Guarda la luce', 'Respira piano']
},

{
icon:'☁️ 🧸 ⭐',
title:'L’amico morbido',
text:[
`Arrivò un orsetto morbido.`,
`Poi una stellina.`,
`Poi una nuvola piccola.`
],
choices:['Tocca la nuvola', 'Sorridi alla stellina']
},

{
icon:'✨ 🌙 🤍',
title:'La calma',
text:[
`Tutti camminavano piano.`,
`Piano piano.`,
`${name} era al sicuro.`,
`La stellina disse: “Buona notte, piccolo cuore.”`
],
choices:['Chiudi gli occhi', 'Buonanotte']
}

];

}

document.getElementById('title').innerText = title;

document.getElementById('scenes').innerHTML = scenes.map(scene => `
<section class="scene">
<div class="visual">${scene.icon}</div>
<h2>${scene.title}</h2>
${scene.text.map(p => `<p>${mark(p)}</p>`).join('')}
<div class="choices">
${scene.choices.map(choice => `<span class="choice">${choice}</span>`).join('')}
</div>
</section>
`).join('');

const fullText = scenes.map(scene => {
return scene.title + '. ' + scene.text.join(' ');
}).join('\n\n');

localStorage.setItem('fableaCurrentStory', JSON.stringify({
title:title,
subtitle:'Una storia lenta e rassicurante',
icon:scenes[0].icon,
text:fullText
}));
</script>

</body>
</html>
