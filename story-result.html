<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FABLEA | Libro vivo</title><link rel="stylesheet" href="/assets/css/fablea.css"><script src="/assets/js/fablea-ui.js"></script><script src="/assets/js/fablea-grammar.js"></script><script src="/assets/js/fablea-profile.js"></script><script src="/stories-v2/age-2-4.js"></script><script src="/stories-v2/age-5-7.js"></script><script src="/stories-v2/age-8-10.js"></script><script src="/stories-v2/age-11-12.js"></script><script src="/stories-v2/index.js"></script><script src="/assets/js/fablea-story-engine.js"></script></head><body class="fablea-page theme-night"><main class="stage"><div class="top"><a class="back" href="/story.html">← Modifica esperienza</a><div class="badge">Libro vivo FABLEA</div><a class="back" href="/child-hub.html">⌂ Mondo bambino</a></div><section class="hero"><h1 id="mainTitle">La storia è pronta.</h1><div class="subtitle"><span id="meta"></span></div></section><section class="book"><div class="illustration" id="illustration"><div class="scene-art" id="sceneArt">✨</div></div><div class="page-card"><div><div class="kicker" id="kicker">Scena narrativa</div><h2 class="story-title" id="title"></h2><div class="meta"><span id="world"></span><span id="duration"></span><span id="family"></span><span id="wc"></span></div><div class="text" id="text"></div><div class="counter" id="counter"></div><div class="progress"><div class="progress-fill" id="progressFill"></div></div></div><div class="controls"><button class="button" id="prev">← Pagina prima</button><button class="button primary" id="next">Pagina dopo →</button></div></div></section><section class="audio-zone"><div class="audio-status" id="audioStatus">Voce opzionale: il TTS resta disponibile senza cambiare contratto.</div><button class="small-btn primary" id="voiceBtn">▶ Ascolta</button><button class="small-btn" id="pauseBtn">Pausa</button><audio id="storyAudio"></audio></section><section class="ritual" id="ritualBox" style="display:none"><h2>Rituale finale</h2><p id="ritualText"></p><p><strong>Attività:</strong> <span id="activity"></span></p><button class="button primary" id="saveRitualBtn">Salva tesoro e rituale</button></section><div class="footer-actions"><a class="button" href="/story.html">＋ Nuova esperienza</a><a class="button" href="/library.html">📖 Libreria</a></div></main><script>
const F=FableaProfile,E=FableaStoryEngine; let profile=F.getSelectedProfile(); const data=JSON.parse(localStorage.getItem('fableaStoryData')||'{}'); let story; if(localStorage.getItem('fableaReopenStory')==='true'){story=JSON.parse(localStorage.getItem('fableaCurrentStory')||'{}'); localStorage.removeItem('fableaReopenStory');} else { if(!profile) location.href='/onboarding.html'; story=E.buildStory(profile,{scenario:data.scenario||profile.primaryWorld,family:data.family||'avventura',mood:data.mood||'Curiosità e voglia di scoprire',duration:data.duration||profile.duration,experience:data.family||''}); E.saveStory(story); }
profile=story.profileSnapshot||profile||{id:story.childId,name:story.child}; let pages=story.pages&&story.pages.length?story.pages:story.text.split(/\n\n+/).map((t,i)=>({id:'p'+i,scene:'Scena '+(i+1),text:t})); let i=0; title.textContent=story.title; meta.textContent=`${story.child} • ${F.ageLabel(story.age)}`; world.textContent=story.world||story.theme; duration.textContent=story.duration; family.textContent=story.family; wc.textContent=`${story.wordCount||E.words(story.text)} parole`; sceneArt.textContent=story.icon||'✨'; ritualText.textContent=story.ritual; activity.textContent=story.activity;
function render(){ text.textContent=pages[i].text; kicker.textContent=pages[i].scene||'Scena'; counter.textContent=`Pagina ${i+1} di ${pages.length}`; progressFill.style.width=((i+1)/pages.length*100)+'%'; prev.disabled=i===0; next.textContent=i===pages.length-1?'Rituale finale ✨':'Pagina dopo →'; ritualBox.style.display=i===pages.length-1?'block':'none'; } prev.onclick=()=>{if(i>0){i--;render();}}; next.onclick=()=>{if(i<pages.length-1){i++;render();} else ritualBox.scrollIntoView({behavior:'smooth'});}; saveRitualBtn.onclick=()=>{ const mem=F.getMemory(profile); const treasures=[...(mem.treasures||[])]; if(!treasures.includes(story.treasure)) treasures.push(story.treasure); F.updateMemory(profile,{treasures, rituals:[...(mem.rituals||[]),{treasure:story.treasure,ritual:story.ritual,story:story.title,activity:story.activity,date:new Date().toLocaleDateString('it-IT')}], lastStory:story.title,lastScenario:story.world,lastActivity:story.activity}); alert('Memoria salvata per '+profile.name); }; render();
voiceBtn.onclick=async()=>{try{audioStatus.textContent='Genero voce...'; const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:story.text})}); if(!r.ok) throw new Error('Voce non disponibile.'); storyAudio.src=URL.createObjectURL(await r.blob()); await storyAudio.play(); audioStatus.textContent='Voce attiva.';}catch(e){audioStatus.textContent=e.message;}}; pauseBtn.onclick=()=>storyAudio.paused?storyAudio.play():storyAudio.pause();
</script></body></html>
