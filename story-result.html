<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Ascolta</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
padding:24px;
font-family:'Nunito',sans-serif;

background:
radial-gradient(circle at top left,#fff1d8 0%,transparent 30%),
radial-gradient(circle at bottom right,#e7dcff 0%,transparent 34%),
linear-gradient(135deg,#f8f1e8 0%,#ece4ea 45%,#d9ddea 100%);

display:flex;
justify-content:center;
align-items:center;

color:#352f36;
}

.player{
width:92%;
max-width:820px;

padding:54px 42px;

border-radius:42px;

background:rgba(255,250,245,.70);

backdrop-filter:blur(16px);

border:1px solid rgba(255,255,255,.6);

box-shadow:0 24px 80px rgba(80,65,55,.15);

text-align:center;
}

.badge{
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#9c8774;
margin-bottom:18px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:52px;
font-weight:600;
margin-bottom:12px;
}

.subtitle{
font-size:16px;
line-height:1.6;
color:#756c70;
margin-bottom:22px;
}

.visual{
height:240px;
border-radius:36px;
margin:26px auto;

background:
radial-gradient(circle at 50% 35%,#fff6cf 0%,transparent 24%),
radial-gradient(circle at 20% 80%,#f8d9b8 0%,transparent 22%),
linear-gradient(135deg,#e7dcff,#f8e3aa);

box-shadow:inset 0 0 70px rgba(255,255,255,.55);

display:flex;
align-items:center;
justify-content:center;

font-size:78px;

animation:breath 5s ease-in-out infinite;

transition:.8s ease;
}

@keyframes breath{
0%{transform:scale(1)}
50%{transform:scale(1.035)}
100%{transform:scale(1)}
}

.scene{
font-size:15px;
color:#8f8078;
margin-top:-10px;
margin-bottom:24px;
}

.text{
font-family:'Cormorant Garamond',serif;
font-size:25px;
line-height:1.72;
color:#4d4452;

max-width:660px;

margin:24px auto 34px;

white-space:pre-line;

max-height:260px;
overflow:auto;

padding:8px 6px;
}

.controls{
display:flex;
gap:14px;
justify-content:center;
flex-wrap:wrap;
}

.button{
padding:15px 26px;

border-radius:999px;

border:0;

cursor:pointer;

font-size:16px;
font-weight:700;

background:
linear-gradient(135deg,#f8e3aa,#e7c870);

color:#322d34;

box-shadow:
0 12px 30px rgba(231,200,112,.25);

transition:.3s;

text-decoration:none;

display:flex;
align-items:center;
justify-content:center;
}

.button:hover{
transform:translateY(-2px);
}

.secondary{
background:rgba(255,255,255,.55);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
box-shadow:none;
}

.footer{
margin-top:30px;
font-size:14px;
color:#988a82;
}

@media(max-width:700px){

.player{
padding:40px 22px;
border-radius:30px;
}

h1{
font-size:38px;
}

.visual{
height:200px;
font-size:64px;
}

.text{
font-size:22px;
max-height:230px;
}

.button{
width:100%;
}

}

</style>

</head>

<body>

<main class="player">

<div class="badge">
Modalità ascolto immersiva
</div>

<h1 id="storyTitle">
Ascolta la storia
</h1>

<div class="subtitle" id="storySubtitle">
Voce lenta, ritmo morbido, immagini che accompagnano la fantasia.
</div>

<div class="visual" id="storyVisual">
🌙
</div>

<div class="scene" id="sceneLabel">
La scena cambia con la storia
</div>

<div class="text" id="storyText">
La storia verrà letta qui.
</div>

<div class="controls">

<button class="button" onclick="playStory()">
▶ Ascolta
</button>

<button class="button secondary" onclick="pauseStory()">
⏸ Pausa
</button>

<button class="button secondary" onclick="stopStory()">
■ Ferma
</button>

<a class="button secondary" href="/activity.html">
Entra nella storia
</a>

<a class="button secondary" href="/story-result.html">
Leggi
</a>

<a class="button secondary" href="/story.html">
Nuova storia
</a>

<a class="button secondary" href="/library.html">
Libreria
</a>

</div>

<div class="footer">
Audio-first • Immagini lente • Ritmo FABLEA
</div>

</main>

<script>

let speech;
let isPaused = false;
let sceneTimer;

const savedStory = localStorage.getItem('fableaCurrentStory');

const story = savedStory ? JSON.parse(savedStory) : {
title:'Ascolta la storia',
subtitle:'Una storia calma per accompagnare immaginazione e presenza.',
icon:'🌙',
text:'Crea prima una storia con FABLEA. Poi torna qui per ascoltarla.'
};

document.getElementById('storyTitle').innerText = story.title;
document.getElementById('storySubtitle').innerText = story.subtitle;
document.getElementById('storyVisual').innerText = story.icon || '🌙';
document.getElementById('storyText').innerText = story.text;

const scenes = [

{keys:['luna','notte','sera'], icon:'🌙 ✨', label:'La luna accompagna il racconto'},

{keys:['mappa','sentiero','strada'], icon:'🗺️ 🌟', label:'Una mappa si illumina piano'},

{keys:['bosco','alberi','foresta'], icon:'🌲 🦊 ✨', label:'Il bosco prende vita'},

{keys:['mare','onde','spiaggia'], icon:'🌊 ⭐', label:'Il mare respira lentamente'},

{keys:['luce','lanterna','brilla'], icon:'🕯️ ✨', label:'Una luce gentile guida la storia'},

{keys:['coraggio','paura','fiducia'], icon:'💛 🛡️', label:'Il coraggio diventa vicino'},

{keys:['ponte','scelta','scegliere'], icon:'🌉 💫', label:'Una scelta apre una nuova strada'},

{keys:['atlante','bussola','futuro'], icon:'🧭 🌌', label:'Una direzione appare nel cielo'},

{keys:['stella','stelle','sogno'], icon:'⭐ ☁️', label:'Le stelle restano accese'}

];

function updateSceneFromText(fragment){

const lower = fragment.toLowerCase();

const found = scenes.find(scene =>
scene.keys.some(key => lower.includes(key))
);

if(found){

document.getElementById('storyVisual').innerText = found.icon;

document.getElementById('sceneLabel').innerText = found.label;

}

}

function animateScenes(){

clearInterval(sceneTimer);

const chunks = story.text.split(/\n\n|\. /).filter(Boolean);

let index = 0;

if(chunks.length === 0) return;

updateSceneFromText(chunks[0]);

sceneTimer = setInterval(() => {

index++;

if(index >= chunks.length){

clearInterval(sceneTimer);

return;

}

updateSceneFromText(chunks[index]);

},5200);

}

function getPreferredVoice(){

const voices = window.speechSynthesis.getVoices();

return voices.find(v =>
v.lang.toLowerCase().includes('it') &&
(
v.name.toLowerCase().includes('elsa') ||
v.name.toLowerCase().includes('alice') ||
v.name.toLowerCase().includes('female') ||
v.name.toLowerCase().includes('paola')
)
) || voices.find(v => v.lang.toLowerCase().includes('it')) || null;

}

function playStory(){

if(isPaused){

window.speechSynthesis.resume();

isPaused = false;

animateScenes();

return;

}

stopStory();

const fullText =
story.title + '. ' +
story.subtitle + '. ' +
story.text;

speech = new SpeechSynthesisUtterance(fullText);

speech.lang = 'it-IT';

speech.rate = 0.72;

speech.pitch = 0.92;

speech.volume = 1;

const preferredVoice = getPreferredVoice();

if(preferredVoice){

speech.voice = preferredVoice;

}

speech.onend = function(){

clearInterval(sceneTimer);

document.getElementById('sceneLabel').innerText =
'La storia si posa piano';

};

window.speechSynthesis.speak(speech);

animateScenes();

}

function pauseStory(){

if(window.speechSynthesis.speaking){

window.speechSynthesis.pause();

isPaused = true;

clearInterval(sceneTimer);

document.getElementById('sceneLabel').innerText =
'La storia è in pausa';

}

}

function stopStory(){

window.speechSynthesis.cancel();

isPaused = false;

clearInterval(sceneTimer);

document.getElementById('storyVisual').innerText =
story.icon || '🌙';

document.getElementById('sceneLabel').innerText =
'La scena cambia con la storia';

}

window.speechSynthesis.onvoiceschanged = function(){

getPreferredVoice();

};

</script>

</body>
</html>
