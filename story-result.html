<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FABLEA | Libro vivo</title>
  <link rel="stylesheet" href="/assets/css/fablea.css">
  <link rel="stylesheet" href="/assets/css/fablea-shell.css">
  <link rel="stylesheet" href="/assets/css/fablea-unified.css">
  <script src="/assets/js/fablea-ui.js"></script>
  <script src="/assets/js/fablea-grammar.js"></script>
  <script src="/assets/js/fablea-profile.js"></script>
  <script src="/stories-v2/age-2-4.js"></script>
  <script src="/stories-v2/age-5-7.js"></script>
  <script src="/stories-v2/age-8-10.js"></script>
  <script src="/stories-v2/age-11-12.js"></script>
  <script src="/stories-v2/index.js"></script>
  <script src="/assets/js/fablea-story-engine.js"></script>
  <script src="/assets/js/fablea-world-state-v3.js"></script>
  <script src="/assets/js/fablea-story-variables-v3.js"></script>
  <script src="/assets/js/fablea-story-engine-v3.js"></script>
  <script src="/assets/js/fablea-world-effects-v3.js"></script>
  <script defer src="/assets/js/fablea-unified-ui.js"></script>
</head>
<body class="fablea-page fablea-product live-book" data-world="Magia">
  <main class="stage">
    <div class="top">
      <a class="brand" href="/child-hub.html">FABLEA</a>
      <div class="badge">Libro vivo</div>
      <a class="back" href="/child-hub.html">Mondo</a>
    </div>

    <section class="hero">
      <div class="kicker" id="mainKicker">La storia di oggi</div>
      <h1 id="mainTitle">La storia è pronta.</h1>
      <div class="subtitle" id="mainSubtitle"></div>
      <div class="meta" id="storyMeta"></div>
    </section>

    <section class="book">
      <div class="illustration" id="illustration" aria-hidden="true">
        <div class="scene-art" id="sceneArt">✨</div>
      </div>
      <article class="page-card" aria-live="polite">
        <div>
          <div class="kicker" id="kicker">Scena narrativa</div>
          <h2 class="story-title" id="title"></h2>
          <div class="text" id="text"></div>
          <div class="counter" id="counter"></div>
          <div class="progress" aria-label="Avanzamento storia"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="controls">
          <button class="button" id="prev" type="button">← Pagina precedente</button>
          <button class="button primary" id="next" type="button">Pagina successiva →</button>
        </div>
      </article>
    </section>

    <section class="audio-zone">
      <div class="audio-status" id="audioStatus" aria-live="polite">Puoi ascoltare la pagina corrente oppure l’intera storia.</div>
      <div class="audio-buttons">
        <button class="small-btn primary" id="voicePageBtn" type="button">▶ Ascolta pagina</button>
        <button class="small-btn" id="voiceAllBtn" type="button">Ascolta tutta</button>
        <button class="small-btn" id="pauseBtn" type="button">Pausa</button>
      </div>
      <audio id="storyAudio"></audio>
    </section>

    <section class="ritual" id="ritualBox">
      <div class="kicker">La storia si chiude, il ricordo resta</div>
      <h2>Rituale finale</h2>
      <p id="ritualText"></p>
      <p><strong>Tesoro:</strong> <span id="treasureText"></span></p>
      <p><strong>Attività:</strong> <span id="activity"></span></p>
      <p id="worldConsequence" hidden><strong>Nel mondo:</strong> <span id="worldConsequenceText"></span></p>
      <button class="button primary" id="saveRitualBtn" type="button">Conserva nel suo mondo</button>
    </section>

    <div class="footer-actions">
      <a class="button secondary" href="/story.html">Modifica esperienza</a>
      <a class="button" href="/story.html">＋ Nuova storia</a>
      <a class="button secondary" href="/library.html">Libreria</a>
      <a class="button secondary" href="/world.html">Mondo</a>
    </div>
  </main>

  <script>
    const F = window.FableaProfile;
    const E = window.FableaStoryEngine;
    const V3 = window.FableaStoryVariablesV3;
    const E3 = window.FableaStoryEngineV3;
    const W3Effects = window.FableaWorldEffectsV3;
    const params = new URLSearchParams(location.search);
    let profile = F.getSelectedProfile();
    const request = F.readJSON('fableaStoryData',{});
    const requestV3 = V3 ? F.readJSON(V3.STORAGE_KEY,null) : null;
    const current = F.readJSON('fableaCurrentStory',null);
    const prepared = F.readJSON(F.KEYS.prepared,null);
    const reopenMode = localStorage.getItem('fableaReopenStory') === 'true';
    let story;

    if(reopenMode && current){
      story = current;
      localStorage.removeItem('fableaReopenStory');
    }else if(prepared && profile && prepared.childId === profile.id && (params.get('prepared') === '1' || request.firstStory)){
      story = prepared;
      localStorage.removeItem(F.KEYS.prepared);
    }else{
      if(!profile){
        location.replace('/onboarding.html');
        throw new Error('Profilo mancante');
      }
      story = E.buildStory(profile,{
        scenario:request.scenario || profile.primaryWorld,
        family:request.family || 'avventura',
        mood:request.mood || 'Curiosità e voglia di scoprire',
        duration:request.duration || profile.duration,
        experience:request.family || ''
      });
      const validV3 = requestV3 && V3 && V3.validate(requestV3).valid && requestV3.profile && requestV3.profile.id === profile.id;
      if(validV3 && E3) story = E3.apply(story,requestV3);
    }

    profile = story.profileSnapshot || profile || {id:story.childId,name:story.child,age:story.age,gender:story.gender,primaryWorld:story.world};
    F.setSelectedProfile(profile.id);
    document.body.dataset.world = story.world || profile.primaryWorld || 'Magia';
    if(window.FableaUI) window.FableaUI.applyAge(document.body,story.age);
    story = E.saveStory(story);

    const pages = Array.isArray(story.pages) && story.pages.length
      ? story.pages
      : String(story.text || '').split(/\n\n+/).map((pageText,index) => ({id:`legacy-${index}`,scene:`Scena ${index + 1}`,text:pageText}));
    let pageIndex = Math.min(Math.max(Number(story.resumePage) || 0,0),pages.length - 1);
    let audioUrl = null;

    const mainTitleEl = document.getElementById('mainTitle');
    const mainSubtitleEl = document.getElementById('mainSubtitle');
    const mainKickerEl = document.getElementById('mainKicker');
    const storyMetaEl = document.getElementById('storyMeta');
    const sceneArtEl = document.getElementById('sceneArt');
    const ritualTextEl = document.getElementById('ritualText');
    const treasureTextEl = document.getElementById('treasureText');
    const activityEl = document.getElementById('activity');
    const worldConsequenceEl = document.getElementById('worldConsequence');
    const worldConsequenceTextEl = document.getElementById('worldConsequenceText');
    const saveRitualButton = document.getElementById('saveRitualBtn');
    const titleEl = document.getElementById('title');
    const kickerEl = document.getElementById('kicker');
    const textEl = document.getElementById('text');
    const counterEl = document.getElementById('counter');
    const progressFillEl = document.getElementById('progressFill');
    const prevButton = document.getElementById('prev');
    const nextButton = document.getElementById('next');
    const ritualBoxEl = document.getElementById('ritualBox');
    const audioStatusEl = document.getElementById('audioStatus');
    const storyAudioEl = document.getElementById('storyAudio');
    const voicePageButton = document.getElementById('voicePageBtn');
    const voiceAllButton = document.getElementById('voiceAllBtn');
    const pauseButton = document.getElementById('pauseBtn');

    mainTitleEl.textContent = story.title;
    mainSubtitleEl.textContent = story.subtitle || '';
    mainKickerEl.textContent = `${story.child} · ${F.ageLabel(story.age)}`;
    storyMetaEl.innerHTML = [story.world,story.duration,story.family,`${story.wordCount || E.words(story.text)} parole`,story.companion,story.v3 ? 'Il mondo continua' : '']
      .filter(Boolean)
      .map(item => `<span>${F.escapeHTML(item)}</span>`)
      .join('');
    sceneArtEl.textContent = story.icon || '✨';
    ritualTextEl.textContent = story.ritual;
    treasureTextEl.textContent = story.treasure;
    activityEl.textContent = story.activity;
    if(story.v3Consequences && story.v3Consequences.summary){
      worldConsequenceEl.hidden = false;
      worldConsequenceTextEl.textContent = story.v3Consequences.summary;
      saveRitualButton.textContent = 'Conserva e fai crescere il mondo';
    }

    function render({persist = true} = {}){
      const page = pages[pageIndex];
      titleEl.textContent = page.scene || `Scena ${pageIndex + 1}`;
      kickerEl.textContent = page.v3Role === 'continuity' ? 'Il mondo ricorda'
        : page.v3Role === 'turning-point' ? 'La svolta'
          : page.v3Role === 'choice' ? 'La vostra scelta'
            : page.v3Role === 'consequence' ? 'Ciò che resta'
              : pageIndex === 0 ? 'La storia comincia' : `Scena ${pageIndex + 1}`;
      textEl.classList.add('fade');
      setTimeout(() => {
        textEl.textContent = page.text;
        textEl.classList.remove('fade');
      },90);
      counterEl.textContent = `Pagina ${pageIndex + 1} di ${pages.length}`;
      progressFillEl.style.width = `${((pageIndex + 1) / pages.length) * 100}%`;
      prevButton.disabled = pageIndex === 0;
      nextButton.textContent = pageIndex === pages.length - 1 ? 'Vai al rituale ✨' : 'Pagina successiva →';
      ritualBoxEl.style.display = pageIndex === pages.length - 1 ? 'block' : 'none';
      if(persist) story = E.updateProgress({...story,pages},pageIndex);
    }

    prevButton.addEventListener('click',() => {
      if(pageIndex > 0){pageIndex -= 1;render();}
    });
    nextButton.addEventListener('click',() => {
      if(pageIndex < pages.length - 1){pageIndex += 1;render();}
      else ritualBoxEl.scrollIntoView({behavior:'smooth',block:'center'});
    });
    document.addEventListener('keydown',event => {
      if(event.key === 'ArrowLeft' && pageIndex > 0){pageIndex -= 1;render();}
      if(event.key === 'ArrowRight' && pageIndex < pages.length - 1){pageIndex += 1;render();}
    });

    async function speak(content){
      try{
        audioStatusEl.textContent = 'Sto preparando la voce…';
        storyAudioEl.pause();
        if(audioUrl) URL.revokeObjectURL(audioUrl);
        const response = await fetch('/api/tts',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({text:content})
        });
        if(!response.ok){
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.error || 'Voce non disponibile in questo momento.');
        }
        audioUrl = URL.createObjectURL(await response.blob());
        storyAudioEl.src = audioUrl;
        await storyAudioEl.play();
        audioStatusEl.textContent = 'Voce attiva.';
        pauseButton.textContent = 'Pausa';
      }catch(error){
        audioStatusEl.textContent = error.message || 'Non è stato possibile generare la voce.';
      }
    }

    voicePageButton.addEventListener('click',() => speak(pages[pageIndex].text));
    voiceAllButton.addEventListener('click',() => speak(story.text));
    pauseButton.addEventListener('click',async () => {
      if(!storyAudioEl.src) return;
      if(storyAudioEl.paused){await storyAudioEl.play();pauseButton.textContent = 'Pausa';}
      else{storyAudioEl.pause();pauseButton.textContent = 'Riprendi';}
    });

    saveRitualButton.addEventListener('click',() => {
      const memory = F.getMemory(profile);
      const treasures = [...(memory.treasures || [])];
      if(!treasures.includes(story.treasure)) treasures.push(story.treasure);
      const ritualEntry = {storyId:story.id,story:story.title,treasure:story.treasure,ritual:story.ritual,activity:story.activity,date:new Date().toLocaleDateString('it-IT')};
      const rituals = [ritualEntry,...(memory.rituals || []).filter(item => item.storyId !== story.id)];
      F.updateMemory(profile,{
        treasures,
        rituals,
        lastStory:story.title,
        lastStoryId:story.id,
        lastScenario:story.world,
        lastCompanion:story.companion,
        lastActivity:story.activity,
        resume:null
      });
      if(W3Effects) W3Effects.commit(profile,story);
      saveRitualButton.disabled = true;
      saveRitualButton.textContent = story.v3Consequences ? 'Il mondo è cresciuto ✓' : 'Conservato nel suo mondo ✓';
    });

    render({persist:false});
  </script>
</body>
</html>
