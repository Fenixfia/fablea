<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Storia</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
padding:24px;
font-family:'Nunito',sans-serif;
background:
radial-gradient(circle at top left,#fff1d8 0%,transparent 30%),
radial-gradient(circle at bottom right,#e7dcff 0%,transparent 34%),
linear-gradient(135deg,#f8f1e8 0%,#ece4ea 45%,#d9ddea 100%);
display:flex;
justify-content:center;
align-items:center;
color:#352f36;
}

.card{
width:92%;
max-width:920px;
padding:58px 46px;
border-radius:42px;
background:rgba(255,251,247,.72);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.6);
box-shadow:0 24px 80px rgba(70,60,50,.12);
}

.badge{
text-align:center;
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#9f8a76;
margin-bottom:20px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:56px;
font-weight:600;
text-align:center;
margin-bottom:12px;
}

.subtitle{
text-align:center;
font-size:17px;
color:#756c70;
margin-bottom:34px;
}

.illustration{
height:210px;
border-radius:34px;
margin-bottom:36px;
background:
radial-gradient(circle at 50% 34%,#fff6cf 0%,transparent 24%),
radial-gradient(circle at 20% 80%,#f8d9b8 0%,transparent 22%),
linear-gradient(135deg,#e7dcff,#f8e3aa);
box-shadow:inset 0 0 70px rgba(255,255,255,.55);
display:flex;
align-items:center;
justify-content:center;
font-size:62px;
animation:softFloat 6s ease-in-out infinite;
}

@keyframes softFloat{
0%{transform:translateY(0)}
50%{transform:translateY(-5px)}
100%{transform:translateY(0)}
}

.story{
font-family:'Cormorant Garamond',serif;
font-size:29px;
line-height:1.82;
color:#4d4550;
}

.story p{
margin-bottom:26px;
}

.meraviglia .story{
font-size:32px;
line-height:1.72;
text-align:center;
}

.meraviglia .illustration{
height:260px;
font-size:78px;
}

.age-note{
margin:0 auto 34px;
max-width:640px;
padding:18px 22px;
border-radius:24px;
background:rgba(255,255,255,.42);
border:1px solid rgba(80,65,55,.08);
text-align:center;
font-size:15px;
line-height:1.6;
color:#7b706c;
}

.actions{
margin-top:42px;
display:flex;
gap:16px;
justify-content:center;
flex-wrap:wrap;
}

.button{
padding:15px 28px;
border-radius:999px;
border:0;
cursor:pointer;
text-decoration:none;
font-size:16px;
font-weight:700;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#322d34;
box-shadow:0 12px 30px rgba(231,200,112,.25);
}

.secondary{
background:rgba(255,255,255,.55);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
box-shadow:none;
}

.footer{
margin-top:34px;
text-align:center;
font-size:14px;
color:#988a82;
}

@media(max-width:700px){
.card{padding:42px 24px;border-radius:30px}
h1{font-size:40px}
.story{font-size:24px}
.meraviglia .story{font-size:27px}
.illustration{height:155px;font-size:46px}
.meraviglia .illustration{height:220px;font-size:64px}
.button{width:100%;text-align:center}
}
</style>
</head>

<body>

<main class="card" id="card">

<div class="badge" id="badge">FABLEA story</div>

<h1 id="title">La storia di oggi</h1>

<div class="subtitle" id="subtitle">
Una storia creata per accompagnare immaginazione e calma.
</div>

<div class="illustration" id="icon">🌙 📖 ✨</div>

<div class="age-note" id="ageNote"></div>

<section class="story" id="storyText"></section>

<div class="actions">
<a class="button" href="/story-player.html">Ascolta la voce narrante</a>
<a class="button secondary" href="/story.html">Crea un’altra storia</a>
<a class="button secondary" href="/library.html">Libreria</a>
<a class="button secondary" href="/index.html">Home</a>
</div>

<div class="footer">
Ritmo lento • Immaginazione • Bassa stimolazione
</div>

</main>

<script>
const saved = localStorage.getItem('fableaStoryData');

const data = saved ? JSON.parse(saved) : {
name:'il piccolo protagonista',
age:'5-7',
experience:'Storia della sera',
mood:'Tranquilla',
theme:'Foresta magica'
};

const name = data.name || 'il piccolo protagonista';
const age = data.age || '5-7';
const experience = data.experience || 'Storia della sera';
const mood = data.mood || 'Tranquilla';
const theme = data.theme || 'Foresta magica';

let title = '';
let badge = '';
let subtitle = '';
let icon = '';
let ageNote = '';
let paragraphs = [];

if(age === '2-4'){

document.getElementById('card').classList.add('meraviglia');

badge = '2–4 anni • Meraviglia';
title = name + ' e la piccola luce gentile';
subtitle = 'Una storia breve, visiva e rassicurante.';
icon = '🌙 🧸 ✨';
ageNote = 'Per i più piccoli FABLEA usa parole semplici, immagini grandi, ritmo ripetitivo e una chiusura calma. Qui l’immagine e la voce contano più del testo.';

paragraphs = [
`C’era una piccola luce vicino a ${name}.`,
`Faceva piano piano.`,
`Brillava poco. Ma brillava bene.`,
`${name} la guardò. La luce sembrava dire: “Sono qui.”`,
`Arrivò un orsetto morbido. Poi una stellina. Poi una nuvola piccola.`,
`Tutti camminavano piano.`,
`Piano piano.`,
`La luce fece un cerchio caldo.`,
`${name} era al sicuro.`,
`La stellina disse: “Buona notte, piccolo cuore.”`
];

} else if(age === '5-7'){

badge = '5–7 anni • Esplorazione';
title = name + ' e la mappa dei mondi nascosti';
subtitle = 'Un’avventura gentile per esplorare senza fretta.';
icon = '🗺️ ✨ 🦊';
ageNote = 'Per questa fascia FABLEA aggiunge avventura, piccoli misteri e personaggi guida, mantenendo sempre un ritmo morbido.';

paragraphs = [
`Quel giorno ${name} trovò una piccola mappa piegata dentro un libro. Non era una mappa normale: le strade si muovevano piano, come fili dorati disegnati dalla fantasia.`,
`In un angolo c’era scritto: “Non porta lontano chi corre più veloce. Porta lontano chi sa guardare meglio.”`,
`${name} appoggiò un dito sul primo sentiero e subito comparve un mondo fatto di ${theme.toLowerCase()}. C’erano luci sospese, ponti morbidi e una porta minuscola che sembrava aspettare proprio lì.`,
`Dietro la porta viveva una volpe con una sciarpa color miele. Conosceva tutti i rumori del bosco e tutti i silenzi della sera.`,
`“Oggi la tua giornata è stata ${mood.toLowerCase()},” disse la volpe. “Allora scegliamo un passo piccolo. Un passo coraggioso, ma non troppo grande.”`,
`${name} fece quel passo. Una foglia si illuminò. Poi un’altra. Poi tutto il sentiero iniziò a brillare come se qualcuno avesse acceso le stelle una alla volta.`,
`La volpe sorrise. “Vedi? Le avventure non servono sempre per andare lontano. A volte servono per scoprire che dentro di te c’è già una luce.”`,
`Quando la mappa tornò silenziosa, ${name} la richiuse piano. Ma una stellina rimase tra le dita, piccola e calda, pronta per la prossima avventura.`
];

} else if(age === '8-10'){

badge = '8–10 anni • Identità';
title = name + ' e il ponte delle scelte';
subtitle = 'Una storia su emozioni, coraggio e piccoli cambiamenti interiori.';
icon = '🌉 💛 🌙';
ageNote = 'Per 8–10 anni FABLEA lavora su identità, decisioni, relazioni, autostima e riconoscimento delle emozioni.';

paragraphs = [
`Nel cuore di una città segreta, dove le case avevano finestre illuminate anche di giorno, ${name} trovò un ponte sospeso tra due colline.`,
`Il ponte non era fatto di legno né di pietra. Era fatto di scelte: alcune leggere, altre più difficili, altre ancora così piccole che quasi non sembravano importanti.`,
`Sotto il ponte scorreva un fiume calmo. Ogni volta che ${name} guardava l’acqua, vedeva un riflesso diverso: una paura, una domanda, un desiderio, un pensiero rimasto lì dopo una giornata ${mood.toLowerCase()}.`,
`All’inizio ${name} non sapeva quale passo fare. Restare fermo sembrava più sicuro. Ma una voce dal fiume disse: “Non devi sapere tutto. Devi solo ascoltare il passo che senti più vero.”`,
`Sul ponte apparvero tre luci. La prima diceva: coraggio. La seconda diceva: gentilezza. La terza diceva: fiducia.`,
`${name} capì che scegliere non vuol dire non avere paura. Vuol dire portare con sé la paura senza lasciarle tenere il timone.`,
`Fece un passo verso la luce della fiducia. Il ponte vibrò piano, come se fosse felice di essere attraversato.`,
`Quando arrivò dall’altra parte, la città segreta non sembrava più così lontana. Sembrava un posto già conosciuto, come una parte di sé che finalmente aveva trovato una strada.`
];

} else {

badge = '11–12 anni • Direzione';
title = name + ' e l’atlante dei futuri possibili';
subtitle = 'Un racconto più profondo, quasi cinematografico, su sogni e direzione.';
icon = '🌌 🧭 📖';
ageNote = 'Per 11–12 anni FABLEA diventa più profonda: meno infantile, più simbolica, con temi di identità, futuro e direzione personale.';

paragraphs = [
`La sera in cui ${name} trovò l’atlante, il cielo sembrava più grande del solito. Non più scuro. Solo più profondo, come se contenesse strade che nessuno aveva ancora nominato.`,
`L’atlante era appoggiato su una scrivania di legno chiaro. Non aveva titolo. Solo una bussola disegnata in copertina e una frase sottile: “Non tutte le direzioni si vedono da fuori.”`,
`${name} lo aprì. Le pagine non mostravano Paesi o città, ma possibilità: una pagina era fatta di coraggio, una di dubbi, una di errori utili, una di sogni ancora confusi.`,
`Dopo una giornata ${mood.toLowerCase()}, quelle pagine sembravano parlare senza giudicare. Non dicevano cosa diventare. Chiedevano soltanto: “Che cosa ti fa sentire vivo quando nessuno ti guarda?”`,
`${name} seguì una linea d’inchiostro blu che attraversava un mondo di ${theme.toLowerCase()}. Lì incontrò una figura con un mantello di stelle, non vecchia e non giovane, come se fosse fatta di domande.`,
`“La direzione non è una risposta immediata,” disse la figura. “È una serie di piccoli segnali che impari a riconoscere.”`,
`Allora ${name} guardò l’atlante con più calma. Vide che anche le pagine incerte avevano valore. Anche gli spazi bianchi non erano vuoti: erano luoghi dove qualcosa poteva ancora nascere.`,
`Quando chiuse il libro, la bussola sulla copertina brillò appena. Non indicava nord. Indicava avanti.`
];

}

document.getElementById('badge').innerText = badge;
document.getElementById('title').innerText = title;
document.getElementById('subtitle').innerText = subtitle;
document.getElementById('icon').innerText = icon;
document.getElementById('ageNote').innerText = ageNote;
document.getElementById('storyText').innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');

localStorage.setItem('fableaCurrentStory', JSON.stringify({
title:title,
subtitle:subtitle,
icon:icon,
text:paragraphs.join('\n\n')
}));
</script>

</body>
</html>
