<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Georgia,serif;
background:
radial-gradient(circle at top left,#fff3d8 0%,transparent 32%),
radial-gradient(circle at bottom right,#d9d7ff 0%,transparent 34%),
linear-gradient(135deg,#f7efe1,#dfe7ee 55%,#cfd7ea);
color:#2f2a27;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}

.page{
width:100%;
max-width:980px;
min-height:82vh;
border-radius:42px;
background:rgba(255,250,240,.72);
border:1px solid rgba(255,255,255,.65);
box-shadow:0 35px 90px rgba(80,65,45,.18);
padding:54px 42px;
display:flex;
flex-direction:column;
justify-content:center;
text-align:center;
position:relative;
overflow:hidden;
}

.page:before{
content:"";
position:absolute;
inset:28px;
border:1px solid rgba(120,100,70,.18);
border-radius:32px;
pointer-events:none;
}

.badge{
font-size:13px;
letter-spacing:4px;
text-transform:uppercase;
color:#7d746c;
margin-bottom:22px;
}

h1{
font-size:78px;
letter-spacing:10px;
font-weight:400;
margin:0 0 22px;
color:#2d2a32;
}

.subtitle{
font-size:28px;
line-height:1.45;
max-width:720px;
margin:0 auto 26px;
color:#3b3838;
}

.text{
font-size:19px;
line-height:1.8;
max-width:650px;
margin:0 auto 38px;
color:#625c57;
}

.button{
display:inline-block;
text-decoration:none;
padding:18px 34px;
border-radius:999px;
background:#2f3a56;
color:#fffaf0;
font-size:18px;
box-shadow:0 18px 35px rgba(47,58,86,.24);
transition:.25s;
}

.button:hover{
transform:translateY(-2px);
background:#26304a;
}

.note{
margin-top:26px;
font-size:14px;
color:#837970;
}

@media(max-width:650px){
.page{padding:42px 24px;border-radius:30px}
h1{font-size:52px;letter-spacing:7px}
.subtitle{font-size:23px}
.text{font-size:17px}
}
</style>
</head>

<body>

<main class="page">
<div class="badge">The quiet imagination project</div>

<h1>FABLEA</h1>

<div class="subtitle">
Stories that calm the evening and wake up imagination.
</div>

<div class="text">
FABLEA creates soft, personal bedtime stories for children.
A small ritual for parents and little minds: less screen, more wonder.
</div>

<a class="button" href="/story.html">Begin tonight’s story</a>

<div class="note">
Audio-first • Low stimulation • Made for bedtime
</div>
</main>

</body>
</html>
