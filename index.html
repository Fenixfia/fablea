<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA</title>

<style>
body{
margin:0;
padding:0;
font-family: Georgia, serif;
background:
radial-gradient(circle at top,#1d2745,#090b14 70%);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

.container{
text-align:center;
padding:30px;
max-width:700px;
position:relative;
z-index:2;
}

h1{
font-size:72px;
letter-spacing:8px;
margin-bottom:20px;
font-weight:300;
}

p{
font-size:22px;
line-height:1.8;
color:#d8d8d8;
margin-bottom:40px;
}

.story-button{
display:inline-block;
text-decoration:none;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
color:white;
padding:18px 34px;
font-size:18px;
border-radius:40px;
cursor:pointer;
backdrop-filter:blur(10px);
transition:0.3s;
}

.story-button:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.15);
}

.stars{
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px, transparent 1px);
background-size:40px 40px;
opacity:0.15;
animation:move 60s linear infinite;
}

@keyframes move{
from{transform:translateY(0);}
to{transform:translateY(-200px);}
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
<h1>FABLEA</h1>

<p>
Quiet stories for curious little minds.<br>
A calmer way to imagine.
</p>

<a href="story.html" class="story-button">
Begin tonight’s story
</a>
</div>

</body>
</html>
