<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Profili</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
min-height:100vh;
padding:24px;
font-family:'Nunito',sans-serif;
background:
radial-gradient(circle at top left,#fff1d8 0%,transparent 30%),
radial-gradient(circle at bottom right,#e7dcff 0%,transparent 34%),
linear-gradient(135deg,#f8f1e8 0%,#ece4ea 45%,#d9ddea 100%);
color:#352f36;
}

.page{
max-width:1080px;
margin:auto;
padding:52px 44px;
border-radius:42px;
background:rgba(255,251,247,.74);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.6);
box-shadow:0 24px 80px rgba(70,60,50,.12);
}

.badge{
text-align:center;
font-size:12px;
letter-spacing:5px;
text-transform:uppercase;
color:#9f8a76;
margin-bottom:18px;
}

h1{
font-family:'Cormorant Garamond',serif;
font-size:58px;
text-align:center;
font-weight:600;
margin-bottom:14px;
}

.intro{
text-align:center;
font-size:18px;
line-height:1.7;
color:#756c70;
max-width:740px;
margin:0 auto 38px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.child{
padding:30px;
border-radius:34px;
background:rgba(255,255,255,.50);
border:1px solid rgba(80,65,55,.10);
box-shadow:0 16px 38px rgba(80,65,55,.08);
transition:.25s;
}

.child.active{
background:rgba(255,248,225,.72);
border:1px solid rgba(231,200,112,.55);
box-shadow:0 18px 40px rgba(231,200,112,.18);
}

.avatar{
width:84px;
height:84px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
background:linear-gradient(135deg,#f8e3aa,#e7dcff);
margin-bottom:18px;
}

.child h2{
font-family:'Cormorant Garamond',serif;
font-size:38px;
font-weight:600;
margin-bottom:8px;
}

.meta{
font-size:15px;
font-weight:800;
color:#9f8a76;
margin-bottom:16px;
}

.child p{
font-size:16px;
line-height:1.65;
color:#6d6668;
margin-bottom:16px;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:14px;
}

.tag{
font-size:13px;
padding:8px 12px;
border-radius:999px;
background:rgba(255,250,245,.72);
color:#8f8078;
border:1px solid rgba(80,65,55,.08);
font-weight:800;
}

.child-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:22px;
}

.small-button{
padding:12px 16px;
border-radius:999px;
border:0;
cursor:pointer;
font-size:14px;
font-weight:800;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#332d35;
text-decoration:none;
}

.small-secondary{
background:rgba(255,255,255,.55);
border:1px solid rgba(80,65,55,.10);
color:#6b6467;
}

.empty{
text-align:center;
padding:38px 28px;
border-radius:34px;
background:rgba(255,255,255,.50);
border:1px solid rgba(80,65,55,.10);
max-width:760px;
margin:0 auto;
}

.empty h2{
font-family:'Cormorant Garamond',serif;
font-size:38px;
font-weight:600;
margin-bottom:14px;
}

.empty p{
font-size:17px;
line-height:1.7;
color:#756c70;
margin-bottom:24px;
}

.actions{
display:flex;
gap:14px;
flex-wrap:wrap;
justify-content:center;
margin-top:38px;
}

.button{
display:inline-flex;
justify-content:center;
align-items:center;
padding:15px 26px;
border-radius:999px;
background:linear-gradient(135deg,#f8e3aa,#e7c870);
color:#332d35;
font-size:16px;
font-weight:800;
text-decoration:none;
box-shadow:0 14px 28px rgba(181,145,73,.16);
border:0;
cursor:pointer;
}

.secondary{
background:rgba(255,255,255,.55);
box-shadow:none;
color:#6b6467;
border:1px solid rgba(80,65,55,.10);
}

@media(max-width:820px){
.page{padding:40px 22px;border-radius:30px}
h1{font-size:42px}
.grid{grid-template-columns:1fr}
.button{width:100%}
}
</style>
</head>

<body>

<main class="page">

<div class="badge">Profili bambino</div>

<h1>Chi entra oggi in FABLEA?</h1>

<div class="intro">
Scegli il profilo del bambino. FABLEA userà età, interessi e ritmo ideale per adattare storie, voce, immagini e attività.
</div>

<div id="profileArea"></div>

<div class="actions">
<a class="button" href="/onboarding.html">Aggiungi bambino</a>
<a class="button secondary" href="/story.html">Crea storia</a>
<a class="button secondary" href="/library.html">Libreria</a>
<a class="button secondary" href="/index.html">Home</a>
</div>

</main>

<script>
const area = document.getElementById('profileArea');

function getProfiles(){
return JSON.parse(localStorage.getItem('fableaChildProfiles') || '[]');
}

function saveProfiles(profiles){
localStorage.setItem('fableaChildProfiles', JSON.stringify(profiles));
}

function selectedId(){
return localStorage.getItem('fableaSelectedChildId');
}

function ageLabel(value){
if(value === '2-4') return '2–4 anni • Meraviglia';
if(value === '5-7') return '5–7 anni • Esplorazione';
if(value === '8-10') return '8–10 anni • Identità';
if(value === '11-12') return '11–12 anni • Direzione';
return 'Fascia FABLEA';
}

function avatarFor(age){
if(age === '2-4') return '🌙';
if(age === '5-7') return '🦊';
if(age === '8-10') return '💛';
if(age === '11-12') return '🧭';
return '✨';
}

function selectChild(id){
localStorage.setItem('fableaSelectedChildId', id);
window.location.href='/story.html';
}

function deleteChild(id){
const ok = confirm('Vuoi eliminare questo profilo dal prototipo?');
if(!ok) return;

const profiles = getProfiles().filter(profile => profile.id !== id);
saveProfiles(profiles);

if(selectedId() === id){
localStorage.removeItem('fableaSelectedChildId');
}

renderProfiles();
}

function renderProfiles(){
const profiles = getProfiles();
const activeId = selectedId();

if(!profiles.length){
area.innerHTML = `
<div class="empty">
<h2>Nessun profilo creato.</h2>
<p>
Crea il primo piccolo mondo FABLEA inserendo nome, fascia evolutiva, interessi e rituale preferito.
</p>
<a class="button" href="/onboarding.html">Crea profilo bambino</a>
</div>
`;
return;
}

area.innerHTML = `
<div class="grid">
${profiles.map(profile => {
const interests = profile.interests && profile.interests.length
? profile.interests.map(item => `<span class="tag">${item}</span>`).join('')
: `<span class="tag">✨ Immaginazione</span>`;

const activeClass = profile.id === activeId ? 'active' : '';

return `
<div class="child ${activeClass}">
<div class="avatar">${avatarFor(profile.age)}</div>
<h2>${profile.name}</h2>
<div class="meta">${ageLabel(profile.age)}</div>
<p>
${profile.support || 'Accendere l’immaginazione'} • ${profile.duration || 'Durata libera'}
</p>
<div class="tags">${interests}</div>

<div class="child-actions">
<button class="small-button" onclick="selectChild('${profile.id}')">Crea storia</button>
<button class="small-button small-secondary" onclick="localStorage.setItem('fableaSelectedChildId','${profile.id}'); renderProfiles();">Seleziona</button>
<button class="small-button small-secondary" onclick="deleteChild('${profile.id}')">Elimina</button>
</div>
</div>
`;
}).join('')}
</div>
`;
}

renderProfiles();
</script>

</body>
</html>
