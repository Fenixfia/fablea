<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FABLEA | Profili</title>
  <link rel="stylesheet" href="/assets/css/fablea.css">
  <link rel="stylesheet" href="/assets/css/fablea-shell.css">
  <link rel="stylesheet" href="/assets/css/fablea-unified.css">
  <script src="/assets/js/fablea-ui.js"></script>
  <script src="/assets/js/fablea-profile.js"></script>
  <script defer src="/assets/js/fablea-unified-ui.js"></script>
</head>
<body class="fablea-page fablea-product" data-world="Magia">
  <main class="page">
    <div class="top">
      <a class="brand" href="/index.html">FABLEA</a>
      <div class="badge">Profili famiglia</div>
      <a class="back" href="/onboarding.html">Aggiungi</a>
    </div>

    <section class="hero">
      <div class="kicker">Mondi separati, stessa famiglia</div>
      <h1>Chi entra oggi in FABLEA?</h1>
      <p class="intro">Ogni profilo conserva un mondo, un compagno, preferenze e memoria indipendenti. Cambiare bambino non mescola mai storie o ricordi.</p>
    </section>

    <div id="profileArea"></div>
  </main>

  <script>
    const F = FableaProfile;
    const area = document.getElementById('profileArea');
    const worldIcons = {
      Dinosauri:'🦕',Mare:'🌊',Animali:'🦊',Spazio:'🚀',Magia:'✨',Foresta:'🌲',
      'Regni e castelli':'🏰','Misteri e scoperte':'🔎'
    };
    const styleLabels = {calm:'calmo',adventurous:'avventuroso',funny:'divertente',mysterious:'misterioso',emotional:'emotivo'};

    function selectChild(id,enter = true){
      F.setSelectedProfile(id);
      const profile = F.getProfiles().find(item => item.id === id);
      if(profile && window.FableaUnifiedUI) window.FableaUnifiedUI.applyProfile(profile);
      if(enter) location.href = '/child-hub.html';
      else renderProfiles();
    }

    function removeFromObjectStorage(key,id){
      const state = F.readJSON(key,{});
      if(state && typeof state === 'object' && !Array.isArray(state)){
        delete state[id];
        F.writeJSON(key,state);
      }
    }

    function deleteChild(id){
      const profiles = F.getProfiles();
      const profile = profiles.find(item => item.id === id);
      if(!profile || !confirm(`Eliminare il profilo di ${profile.name} e la sua memoria locale?`)) return;

      F.saveProfiles(profiles.filter(item => item.id !== id));
      const saved = F.readJSON(F.KEYS.saved,[]).filter(story => story.childId !== id);
      F.writeJSON(F.KEYS.saved,saved);
      removeFromObjectStorage(F.KEYS.memory,id);
      removeFromObjectStorage('fableaWorldStateV3',id);

      const current = F.readJSON('fableaCurrentStory',null);
      if(current && current.childId === id) localStorage.removeItem('fableaCurrentStory');
      const prepared = F.readJSON(F.KEYS.prepared,null);
      if(prepared && prepared.childId === id) localStorage.removeItem(F.KEYS.prepared);
      const requestV3 = F.readJSON('fableaStoryRequestV3',null);
      if(requestV3 && requestV3.profile && requestV3.profile.id === id){
        localStorage.removeItem('fableaStoryRequestV3');
        localStorage.removeItem('fableaStoryRequestV3QA');
      }
      if(localStorage.getItem(F.KEYS.selected) === id){
        localStorage.removeItem(F.KEYS.selected);
        const next = F.getProfiles()[0];
        if(next) F.setSelectedProfile(next.id);
      }
      renderProfiles();
    }

    function renderProfiles(){
      const profiles = F.getProfiles();
      const activeId = localStorage.getItem(F.KEYS.selected);
      const activeProfile = profiles.find(item => item.id === activeId) || profiles[0];
      if(activeProfile && window.FableaUnifiedUI) window.FableaUnifiedUI.applyProfile(activeProfile);

      if(!profiles.length){
        area.innerHTML = '<div class="empty"><div class="empty-icon">✨</div><h2>Nessun profilo creato</h2><p>Crea il primo mondo personale FABLEA.</p><a class="button primary" href="/onboarding.html">Crea profilo bambino</a></div>';
        return;
      }

      area.innerHTML = `<div class="grid">${profiles.map(profile => {
        const active = profile.id === activeId;
        return `<article class="child ${active ? 'active' : ''}" data-profile-world="${F.escapeHTML(profile.primaryWorld)}">
          ${active ? '<div class="selected-badge">Profilo selezionato</div>' : ''}
          <div class="avatar">${worldIcons[profile.primaryWorld] || '✨'}</div>
          <h2>${F.escapeHTML(profile.name)}</h2>
          <div class="meta">${F.escapeHTML(F.ageLabel(profile.age))} · ${F.escapeHTML(profile.primaryWorld)}</div>
          <p>${F.escapeHTML(F.genderLabel(profile.gender))} · stile ${F.escapeHTML(styleLabels[profile.storyStyle] || profile.storyStyle)} · durata ${F.escapeHTML(profile.duration)}</p>
          <div class="tags">
            <span class="tag">${F.escapeHTML(profile.support)}</span>
            ${(profile.interests || []).map(item => `<span class="tag">${F.escapeHTML(item)}</span>`).join('')}
            ${profile.favoriteCompanion ? `<span class="tag">Compagno: ${F.escapeHTML(profile.favoriteCompanion)}</span>` : ''}
          </div>
          <div class="child-actions">
            <button class="small-button enter-child" type="button" data-child-id="${F.escapeHTML(profile.id)}">Entra nel mondo</button>
            ${active ? '' : `<button class="small-button small-secondary select-child" type="button" data-child-id="${F.escapeHTML(profile.id)}">Seleziona</button>`}
            <button class="text-danger delete-child" type="button" data-child-id="${F.escapeHTML(profile.id)}">Elimina…</button>
          </div>
        </article>`;
      }).join('')}</div>`;

      area.querySelectorAll('.enter-child').forEach(button => button.addEventListener('click',() => selectChild(button.dataset.childId,true)));
      area.querySelectorAll('.select-child').forEach(button => button.addEventListener('click',() => selectChild(button.dataset.childId,false)));
      area.querySelectorAll('.delete-child').forEach(button => button.addEventListener('click',() => deleteChild(button.dataset.childId)));
    }

    renderProfiles();
  </script>
</body>
</html>
