<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FABLEA | Profili</title>
  <link rel="stylesheet" href="/assets/css/fablea.css">
  <link rel="stylesheet" href="/assets/css/fablea-shell.css">
  <link rel="stylesheet" href="/assets/css/fablea-unified.css">
  <link rel="stylesheet" href="/assets/css/fablea-beta.css">
  <script src="/assets/js/fablea-ui.js"></script>
  <script src="/assets/js/fablea-profile.js"></script>
  <script defer src="/assets/js/fablea-unified-ui.js"></script>
</head>
<body class="beta-page beta-profile-page" data-world="FABLEA">
  <div class="beta-frame">
    <header class="beta-top">
      <a class="beta-brand" href="/index.html">FABLEA</a>
      <div class="beta-pill">Famiglia</div>
      <nav class="beta-nav"><a href="/family-settings.html">Impostazioni</a><a class="always beta-button secondary" href="/onboarding.html">＋ Aggiungi</a></nav>
    </header>

    <main>
      <section class="beta-profile-intro">
        <div class="beta-eyebrow">Ogni bambino, il suo mondo</div>
        <h1 class="beta-title">Scegli chi entra.</h1>
        <p class="beta-lead">Storie, attività e ricordi restano personali. Se c’è un solo profilo, puoi entrare direttamente nella sua Casa.</p>
      </section>
      <div id="profileArea"></div>
    </main>
  </div>

  <script>
    const F = FableaProfile;
    const area = document.getElementById('profileArea');
    const worldIcons = {
      Dinosauri:'🦕',Mare:'🌊',Animali:'🦊',Spazio:'🚀',Magia:'✨',Foresta:'🌲',
      'Regni e castelli':'🏰','Misteri e scoperte':'🔎'
    };
    const styleLabels = {calm:'calmo',adventurous:'avventuroso',funny:'divertente',mysterious:'misterioso',emotional:'emotivo'};
    const sexLabel = value => value === 'male' ? 'Maschio' : value === 'female' ? 'Femmina' : 'Sesso da aggiornare';

    function selectChild(id,enter = true){
      F.setSelectedProfile(id);
      const profile = F.getProfiles().find(item => item.id === id);
      if(profile && window.FableaUnifiedUI) window.FableaUnifiedUI.applyProfile(profile);
      if(enter) location.href = '/child-hub.html';
      else renderProfiles();
    }

    function removeFromObjectStorage(key,id){
      const state = F.readJSON(key,{});
      if(state && typeof state === 'object' && !Array.isArray(state)){
        delete state[id];
        F.writeJSON(key,state);
      }
    }

    function deleteChild(id){
      const profiles = F.getProfiles();
      const profile = profiles.find(item => item.id === id);
      if(!profile || !confirm(`Eliminare il profilo di ${profile.name} e la sua memoria locale?`)) return;

      F.saveProfiles(profiles.filter(item => item.id !== id));
      const saved = F.readJSON(F.KEYS.saved,[]).filter(story => story.childId !== id);
      F.writeJSON(F.KEYS.saved,saved);
      removeFromObjectStorage(F.KEYS.memory,id);
      removeFromObjectStorage('fableaWorldStateV3',id);

      const current = F.readJSON('fableaCurrentStory',null);
      if(current && current.childId === id) localStorage.removeItem('fableaCurrentStory');
      const prepared = F.readJSON(F.KEYS.prepared,null);
      if(prepared && prepared.childId === id) localStorage.removeItem(F.KEYS.prepared);
      const requestV3 = F.readJSON('fableaStoryRequestV3',null);
      if(requestV3 && requestV3.profile && requestV3.profile.id === id){
        localStorage.removeItem('fableaStoryRequestV3');
        localStorage.removeItem('fableaStoryRequestV3QA');
      }
      if(localStorage.getItem(F.KEYS.selected) === id){
        localStorage.removeItem(F.KEYS.selected);
        const next = F.getProfiles()[0];
        if(next) F.setSelectedProfile(next.id);
      }
      renderProfiles();
    }

    function renderProfiles(){
      const profiles = F.getProfiles();
      const activeId = localStorage.getItem(F.KEYS.selected);
      const activeProfile = profiles.find(item => item.id === activeId) || profiles[0];
      if(window.FableaUnifiedUI){
        if(activeProfile) window.FableaUnifiedUI.applyProfile(activeProfile);
        else window.FableaUnifiedUI.applyWorld(window.FableaUnifiedUI.NEUTRAL_WORLD || 'FABLEA');
      }

      if(!profiles.length){
        area.innerHTML = '<section class="beta-card beta-profile-empty"><div class="beta-eyebrow">La prima porta</div><h2>Crea il primo mondo.</h2><p>Servono solo pochi passaggi per preparare una Casa personale.</p><a class="beta-button primary" href="/onboarding.html">Crea il primo profilo</a></section>';
        return;
      }

      area.innerHTML = `<div class="beta-profile-grid">${profiles.map(profile => {
        const active = profile.id === activeId;
        return `<article class="beta-card beta-profile-card ${active ? 'active' : ''}" data-profile-world="${F.escapeHTML(profile.primaryWorld)}">
          <div class="beta-profile-glow" aria-hidden="true"></div>
          <div class="beta-profile-head">
            <div class="beta-profile-avatar">${worldIcons[profile.primaryWorld] || '✨'}</div>
            ${active ? '<div class="beta-pill">In uso</div>' : ''}
          </div>
          <div class="beta-eyebrow">${F.escapeHTML(F.ageLabel(profile.age))} · ${F.escapeHTML(profile.primaryWorld)}</div>
          <h2>${F.escapeHTML(profile.name)}</h2>
          <p>${profile.favoriteCompanion ? `Con ${F.escapeHTML(profile.favoriteCompanion)}, il suo compagno.` : 'Il suo mondo personale è pronto.'}</p>
          <div class="beta-profile-actions">
            <button class="beta-button primary enter-child" type="button" data-child-id="${F.escapeHTML(profile.id)}">Entra nella Casa</button>
            ${active ? '' : `<button class="beta-button secondary select-child" type="button" data-child-id="${F.escapeHTML(profile.id)}">Imposta come attivo</button>`}
            <button class="beta-profile-manage delete-child" type="button" data-child-id="${F.escapeHTML(profile.id)}">Elimina profilo</button>
          </div>
        </article>`;
      }).join('')}<a class="beta-profile-add" href="/onboarding.html"><span>＋</span><strong>Aggiungi un bambino</strong><small>Crea un nuovo mondo personale</small></a></div>`;

      area.querySelectorAll('.enter-child').forEach(button => button.addEventListener('click',() => selectChild(button.dataset.childId,true)));
      area.querySelectorAll('.select-child').forEach(button => button.addEventListener('click',() => selectChild(button.dataset.childId,false)));
      area.querySelectorAll('.delete-child').forEach(button => button.addEventListener('click',() => deleteChild(button.dataset.childId)));
    }

    renderProfiles();
  </script>
</body>
</html>
