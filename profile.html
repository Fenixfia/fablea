<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Profili</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/fablea.css">
<script src="/assets/js/fablea-ui.js" defer></script>
</head>

<body class="fablea-page">

<main class="page">

<div class="badge">Profili famiglia</div>

<h1>Chi entra oggi in FABLEA?</h1>

<div class="intro">
Scegli il bambino. FABLEA userà il suo piccolo mondo per adattare storie, immagini, ritmo, voce e attività.
</div>

<div id="profileArea"></div>

<div class="actions">
<a class="button" href="/onboarding.html">Aggiungi bambino</a>
<a class="button secondary" href="/story.html">Crea storia</a>
<a class="button secondary" href="/library.html">Libreria</a>
<a class="button secondary" href="/index.html">Home</a>
</div>

<div class="footer">
Index → Onboarding → Profile → Story → Result → Player
</div>

</main>

<script>
const area = document.getElementById('profileArea');

function getProfiles(){
return JSON.parse(localStorage.getItem('fableaChildProfiles') || '[]');
}

function saveProfiles(profiles){
localStorage.setItem('fableaChildProfiles', JSON.stringify(profiles));
}

function selectedId(){
return localStorage.getItem('fableaSelectedChildId');
}

function ageLabel(value){
if(value === '2-4') return '2–4 anni • Meraviglia';
if(value === '5-7') return '5–7 anni • Esplorazione';
if(value === '8-10') return '8–10 anni • Identità';
if(value === '11-12') return '11–12 anni • Direzione';
return 'Fascia FABLEA';
}

function avatarFor(age){
if(age === '2-4') return '🌙';
if(age === '5-7') return '🦊';
if(age === '8-10') return '💛';
if(age === '11-12') return '🧭';
return '✨';
}

function selectChild(id){
localStorage.setItem('fableaSelectedChildId', id);
window.location.href='/child-hub.html';
}

function onlySelectChild(id){
localStorage.setItem('fableaSelectedChildId', id);
renderProfiles();
}

function deleteChild(id){
const ok = confirm('Vuoi eliminare questo profilo dal prototipo?');
if(!ok) return;

const profiles = getProfiles().filter(profile => profile.id !== id);
saveProfiles(profiles);

if(selectedId() === id){
localStorage.removeItem('fableaSelectedChildId');
}

renderProfiles();
}

function profileDescription(profile){
if(profile.age === '2-4') return 'Esperienze visive, parole semplici, immagini grandi e voce morbida.';
if(profile.age === '5-7') return 'Avventure leggibili, scelte chiare e mondi da esplorare.';
if(profile.age === '8-10') return 'Storie su emozioni, amicizia, coraggio e autostima.';
if(profile.age === '11-12') return 'Racconti più maturi su identità, sogni e direzione.';
return 'Storie calme e personalizzate.';
}

function renderProfiles(){
const profiles = getProfiles();
const activeId = selectedId();

if(!profiles.length){
area.innerHTML = `
<div class="empty">
<h2>Nessun profilo creato.</h2>
<p>
Crea il primo piccolo mondo FABLEA: nome, fascia evolutiva, interessi e rituale preferito.
</p>
<a class="button" href="/onboarding.html">Crea profilo bambino</a>
</div>
`;
return;
}

area.innerHTML = `
<div class="grid">
${profiles.map(profile => {
const interests = profile.interests && profile.interests.length
? profile.interests.map(item => `<span class="tag">${item}</span>`).join('')
: `<span class="tag">✨ Immaginazione</span>`;

const activeClass = profile.id === activeId ? 'active' : '';
const selectedBadge = profile.id === activeId ? '<div class="selected-badge">Profilo selezionato</div>' : '';

return `
<div class="child ${activeClass}">
${selectedBadge}
<div class="avatar">${avatarFor(profile.age)}</div>
<h2>${profile.name}</h2>
<div class="meta">${ageLabel(profile.age)}</div>
<div class="description">${profileDescription(profile)}</div>

<div class="tags">
${interests}
</div>

<div class="child-actions">
<button class="small-button" onclick="selectChild('${profile.id}')">Entra nel mondo</button>
<button class="small-button small-secondary" onclick="onlySelectChild('${profile.id}')">Seleziona</button>
<button class="text-danger" onclick="deleteChild('${profile.id}')">Elimina…</button>
</div>
</div>
`;
}).join('')}
</div>
`;
}

renderProfiles();
</script>

</body>
</html>
