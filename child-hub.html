<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FABLEA | Mondo bambino</title><link rel="stylesheet" href="/assets/css/fablea.css"><script src="/assets/js/fablea-ui.js"></script><script src="/assets/js/fablea-grammar.js"></script><script src="/assets/js/fablea-profile.js"></script><script src="/stories-v2/age-2-4.js"></script><script src="/stories-v2/age-5-7.js"></script><script src="/stories-v2/age-8-10.js"></script><script src="/stories-v2/age-11-12.js"></script><script src="/stories-v2/index.js"></script><script src="/assets/js/fablea-story-engine.js"></script></head><body class="fablea-page"><main class="page"><div id="content"></div></main><script>
const F=FableaProfile,p=F.getSelectedProfile(); if(!p) content.innerHTML='<div class="empty"><h1>Nessun profilo</h1><a class="button" href="/onboarding.html">Crea profilo</a></div>'; else { const m=F.getMemory(p); const g=FableaGrammar.words(p); content.innerHTML=`<div class="top"><a class="back" href="/onboarding.html">← Profili</a><div class="badge">Casa narrativa v2</div><a class="back" href="/library.html">Libreria</a></div><section class="hero"><div class="avatar-card"><div class="avatar">✨</div><h2>${F.escapeHTML(p.name)}</h2><div class="meta">${F.ageLabel(p.age)} • ${F.escapeHTML(p.primaryWorld)} • ${F.escapeHTML(g.explorer)}</div></div><div class="hero-copy"><h1>Il mondo di ${F.escapeHTML(p.name)} ricorda</h1><p>Genere grammaticale: ${F.escapeHTML(p.gender)}. Interessi secondari: ${p.interests.map(F.escapeHTML).join(', ')||'nessuno'}. Durata abituale: ${p.duration}. Stile: ${p.storyStyle}.</p></div></section><section class="continue"><div class="continue-icon">📖</div><div><h2>${m.lastStory?F.escapeHTML(m.lastStory):'Il primo viaggio è pronto'}</h2><p>Scenario recente: ${F.escapeHTML(m.lastScenario||p.primaryWorld)}.</p><a class="button" href="/story.html">Nuova storia</a></div></section><section class="grid"><div class="card"><h3>Tesori</h3><div class="treasures">${(m.treasures||[]).map(x=>`<span class="treasure">${F.escapeHTML(x)}</span>`).join('')||'<span class="treasure">Nessun tesoro ancora</span>'}</div></div><div class="card"><h3>Rituali</h3><p>${(m.rituals||[]).length} rituali salvati solo per questo bambino.</p></div></section>`; }
</script></body></html>
