<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FABLEA | Mondo bambino</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/css/fablea.css">
<script src="/assets/js/fablea-ui.js" defer></script>
</head>

<body class="fablea-page">

<main class="page">
<div id="content"></div>
</main>

<script>
function getProfiles(){
return JSON.parse(localStorage.getItem('fableaChildProfiles') || '[]');
}

function getSelectedProfile(){
const profiles = getProfiles();
const selectedId = localStorage.getItem('fableaSelectedChildId');

if(!profiles.length) return null;

return profiles.find(profile => profile.id === selectedId) || profiles[0];
}

function getSavedStories(){
return JSON.parse(localStorage.getItem('fableaSavedStories') || '[]');
}

function getWorldState(){
return JSON.parse(localStorage.getItem('fableaWorldState') || '{}');
}

function saveWorldState(state){
localStorage.setItem('fableaWorldState', JSON.stringify(state));
}

function escapeHTML(value){
return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function ageLabel(value){
if(value === '2-4') return '2–4 anni • Meraviglia';
if(value === '5-7') return '5–7 anni • Esplorazione';
if(value === '8-10') return '8–10 anni • Identità';
if(value === '11-12') return '11–12 anni • Direzione';
return 'Fascia FABLEA';
}

function avatarFor(age){
if(age === '2-4') return '🌙';
if(age === '5-7') return '🦊';
if(age === '8-10') return '💛';
if(age === '11-12') return '🧭';
return '✨';
}

function toneFor(profile){
if(profile.age === '2-4') return 'immagini grandi, parole semplici, ritmo morbido e piccole luci rassicuranti.';
if(profile.age === '5-7') return 'avventure leggibili, scelte chiare, curiosità e mondi da esplorare.';
if(profile.age === '8-10') return 'storie emotive, fiducia, relazioni, coraggio e crescita personale.';
if(profile.age === '11-12') return 'racconti più maturi, identità, direzione, domande e possibilità.';
return 'storie personalizzate e immaginazione.';
}

function interestsText(profile){
if(profile.interests && profile.interests.length){
return profile.interests.join(', ');
}
return 'immaginazione, scoperta e meraviglia';
}

function recentForChild(name){
return getSavedStories().filter(story => story.child === name).slice(-1)[0] || null;
}

function storiesCountForChild(name){
return getSavedStories().filter(story => story.child === name).length;
}

function memoriesForChild(name){
const state = getWorldState();
const childState = state[name] || {};
return {
treasures:Array.isArray(childState.treasures) ? childState.treasures : [],
rituals:Array.isArray(childState.rituals) ? childState.rituals : [],
lastStory:childState.lastStory || null
};
}

function startExperience(type){
const profile = getSelectedProfile();

if(!profile){
window.location.href = '/onboarding.html';
return;
}

localStorage.setItem('fableaSelectedChildId', profile.id);

let baseTheme = profile.interests && profile.interests.length
? profile.interests[0].replace(/[^\p{L}\p{N}\s]/gu,'').trim()
: 'Foresta magica';

let data = {
name:profile.name,
age:profile.age,
experience:type,
mood:'Curiosa',
theme:baseTheme || 'Foresta magica',
interests:profile.interests || [],
support:profile.support || '',
duration:profile.duration || '',
quickStart:true
};

if(type === 'Continua il viaggio'){
const last = recentForChild(profile.name);
if(last){
data.theme = last.theme || data.theme;
data.experience = 'Continua il viaggio';
}
}

if(type === 'Momento calma'){
data.mood = 'Tranquilla';
data.theme = 'Luna e calma';
data.experience = 'Mini racconto rilassante';
}

if(type === 'Missione creativa'){
data.mood = 'Piena di energia';
data.theme = 'Manualità e fantasia';
data.experience = 'Missione creativa';
}

if(type === 'Scoperta del giorno'){
data.mood = 'Curiosa';
data.theme = 'Mondo da scoprire';
data.experience = 'Scoperta del giorno';
}

localStorage.setItem('fableaStoryData', JSON.stringify(data));

window.location.href = '/story-result.html';
}

function render(){
const profile = getSelectedProfile();
const content = document.getElementById('content');

if(!profile){
content.innerHTML = `
<div class="empty">
<h1>Nessun esploratore selezionato.</h1>
<p>Crea o scegli un profilo bambino per entrare nel mondo FABLEA.</p>
<a class="button" href="/onboarding.html">Scegli profilo</a>
</div>
`;
return;
}

localStorage.setItem('fableaSelectedChildId', profile.id);

const lastStory = recentForChild(profile.name);
const storyCount = storiesCountForChild(profile.name);
const memories = memoriesForChild(profile.name);
const treasures = memories.treasures;

const tags = profile.interests && profile.interests.length
? profile.interests.map(item => `<span class="tag">${escapeHTML(item)}</span>`).join('')
: `<span class="tag">✨ Immaginazione</span>`;

const continueTitle = lastStory ? escapeHTML(lastStory.title) : 'Il primo viaggio è pronto';
const continueText = lastStory
? `L’ultimo viaggio ha lasciato una traccia nel mondo di ${escapeHTML(profile.name)}. ${escapeHTML(lastStory.subtitle || 'Una piccola luce è rimasta accesa e può guidare la prossima esperienza.')}`
: `Il mondo di ${escapeHTML(profile.name)} è ancora tutto da aprire. La prima storia creerà la prima luce, il primo luogo e il primo ricordo.`;

const continueIcon = lastStory ? (lastStory.icon || avatarFor(profile.age)) : avatarFor(profile.age);

content.innerHTML = `
<div class="top">
<a class="back" href="/onboarding.html">← Cambia esploratore</a>
<div class="badge">Casa narrativa FABLEA</div>
<a class="back" href="/index.html">Home</a>
</div>

<section class="hero">
<div class="glow"></div>

<div class="avatar-card">
<div class="avatar">${avatarFor(profile.age)}</div>
<h2>${escapeHTML(profile.name)}</h2>
<div class="meta">${escapeHTML(ageLabel(profile.age))}</div>
</div>

<div class="hero-copy">
<h1>Bentornato nel mondo di ${escapeHTML(profile.name)}</h1>
<p>
Questo è il suo spazio narrativo personale: storie, oggetti simbolici, viaggi, rituali e piccole esperienze che crescono nel tempo.  
FABLEA userà ${escapeHTML(toneFor(profile))}
</p>
<div class="tags">${tags}</div>
</div>
</section>

<section class="continue">
<div class="continue-icon">${continueIcon}</div>
<div>
<h2>${continueTitle}</h2>
<p>${continueText}</p>
<div class="actions" style="justify-content:flex-start;margin-top:24px;">
${lastStory ? `<button class="button secondary" onclick="startExperience('Continua il viaggio')">Continua il viaggio</button>` : ''}
<a class="button" href="/story-result.html">Nuova storia</a>
</div>
</div>
</section>

<h2 class="section-title">Il mondo ricorda</h2>

<section class="grid">

<div class="card">
<div class="card-icon">⭐</div>
<h3>Tesori trovati</h3>
<p>Piccoli oggetti simbolici che rendono il mondo familiare e danno continuità alle esperienze.</p>
<div class="treasures">
${treasures.length ? treasures.map(item => `<span class="treasure">${escapeHTML(item)}</span>`).join('') : '<span class="treasure">Nessun tesoro ancora conquistato</span>'}
</div>
</div>

<div class="card">
<div class="card-icon">📖</div>
<h3>Storie vissute</h3>
<p>${escapeHTML(profile.name)} ha già vissuto <strong>${storyCount}</strong> esperienze FABLEA su questo dispositivo.</p>
<div class="treasures">
<span class="treasure">${storyCount ? '✨ Mondo attivo' : '🌱 Mondo nuovo'}</span>
<span class="treasure">${lastStory ? '📌 Ultimo viaggio salvato' : '📖 Prima storia da creare'}</span>
</div>
</div>

<div class="card">
<div class="card-icon">🕯️</div>
<h3>Rituale attivo</h3>
<p>
${memories.rituals.length ? `Ultimo rituale salvato: ${escapeHTML(memories.rituals[memories.rituals.length - 1].treasure || 'luce gentile')}.` : 'Nessun rituale salvato: nascerà quando una storia verrà conclusa.'}
</p>
</div>

</section>

<h2 class="section-title">Cosa facciamo oggi?</h2>

<section class="grid">

<div class="card">
<div class="card-icon">📖</div>
<h3>Nuova storia</h3>
<p>Crea una storia più lunga, immersiva e adatta al momento della giornata.</p>
<div class="actions" style="justify-content:flex-start;margin-top:20px;">
<a class="button" href="/story-result.html">Nuova storia</a>
</div>
</div>

<div class="card">
<div class="card-icon">🌙</div>
<h3>Momento calma</h3>
<p>Un’esperienza lenta per respirare, abbassare il ritmo e ritrovare presenza.</p>
<div class="actions" style="justify-content:flex-start;margin-top:20px;">
<button class="button secondary" onclick="startExperience('Momento calma')">Inizia</button>
</div>
</div>

<div class="card">
<div class="card-icon">👐</div>
<h3>Missione creativa</h3>
<p>Una piccola idea per portare la storia fuori dallo schermo, con mani e fantasia.</p>
<div class="actions" style="justify-content:flex-start;margin-top:20px;">
<button class="button secondary" onclick="startExperience('Missione creativa')">Inizia</button>
</div>
</div>

</section>


<div class="footer">
FABLEA non è solo una favola: è un mondo lento, personale e persistente che accompagna immaginazione, calma e scoperta.
</div>
`;
}

render();
</script>

</body>
</html>
