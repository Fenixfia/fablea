<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FABLEA | La tua casa narrativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/fablea.css">
  <link rel="stylesheet" href="/assets/css/fablea-shell.css">
  <link rel="stylesheet" href="/assets/css/fablea-mobile-emotion.css">
  <script src="/assets/js/fablea-ui.js"></script>
  <script src="/assets/js/fablea-grammar.js"></script>
  <script src="/assets/js/fablea-profile.js"></script>
  <script src="/stories-v2/age-2-4.js"></script>
  <script src="/stories-v2/age-5-7.js"></script>
  <script src="/stories-v2/age-8-10.js"></script>
  <script src="/stories-v2/age-11-12.js"></script>
  <script src="/stories-v2/index.js"></script>
  <script src="/assets/js/fablea-story-engine.js"></script>
  <script src="/assets/js/fablea-shell.js"></script>
</head>
<body>
  <div class="shell-page">
    <header class="shell-top">
      <a class="brand" href="/child-hub.html">FABLEA</a>
      <div class="shell-meta"><span id="worldName"></span><a class="profile-link" href="/profile.html">Profili</a></div>
    </header>
    <main class="shell-main" id="root"></main>
    <div id="dock"></div>
  </div>

  <script>
    (function(){
      'use strict';
      const F = window.FableaProfile;
      const S = window.FableaShell;
      const root = document.getElementById('root');
      const profile = F.getSelectedProfile();

      if(!profile){
        root.innerHTML = `<section class="empty-state"><div class="eyebrow">Prima di iniziare</div><h1>Crea il primo mondo.</h1><p>FABLEA ha bisogno di un profilo bambino per ricordare storie, compagni e scoperte.</p><a class="profile-link" href="/onboarding.html">Crea profilo</a></section>`;
        return;
      }

      const presentation = S.applyProfile(profile);
      const memory = F.getMemory(profile);
      const prepared = F.readJSON(F.KEYS.prepared,null);
      const lastStory = S.lastStory(profile);
      const companion = S.companionName(profile);
      document.getElementById('worldName').textContent = presentation.place;
      document.getElementById('dock').innerHTML = S.renderDock('continue');

      let continueLabel = 'Inizia il primo viaggio';
      let continueTitle = `${presentation.place} ti sta aspettando`;
      let continueMeta = 'La prima storia userà il mondo e le preferenze già scelte.';
      let continueAction = '<a class="resume-link" href="/story.html">Comincia</a>';

      if(prepared && prepared.childId === profile.id){
        continueLabel = 'Prima storia pronta';
        continueTitle = prepared.title;
        continueMeta = prepared.subtitle || 'La storia è pronta per essere aperta.';
        continueAction = '<a class="resume-link" href="/story-result.html?prepared=1">Apri</a>';
      }else if(lastStory){
        continueLabel = 'Continua da dove eri';
        continueTitle = lastStory.title;
        continueMeta = `Pagina ${(lastStory.resumePage || 0) + 1} di ${lastStory.pages.length} · ${lastStory.duration}`;
        continueAction = '<button id="resumeStory" type="button">Continua</button>';
      }

      const whisper = lastStory
        ? `Da quando siete passati di qui, ${presentation.place} conserva una nuova traccia.`
        : `${presentation.place} si sta accendendo per il vostro primo ingresso.`;

      root.innerHTML = `
        <div class="mobile-arrival" aria-hidden="true"><div><small>Stai tornando in</small><strong>${S.escapeHTML(presentation.place)}</strong></div></div>
        <section class="hero-grid">
          <div class="hero-copy">
            <div class="eyebrow">Oggi nel mondo di ${S.escapeHTML(profile.name)}</div>
            <h1>La storia vi stava aspettando.</h1>
            <p>${S.escapeHTML(presentation.promise)} Riprendi il viaggio, scopri un racconto curato oppure costruisci insieme al tuo compagno qualcosa di nuovo.</p>
            <article class="resume-card">
              <div class="resume-icon">${S.escapeHTML(presentation.icon)}</div>
              <div><small>${S.escapeHTML(continueLabel)}</small><strong>${S.escapeHTML(continueTitle)}</strong><small>${S.escapeHTML(continueMeta)}</small></div>
              ${continueAction}
            </article>
          </div>

          <div class="world-scene" aria-label="${S.escapeHTML(presentation.place)}">
            <div class="world-whisper">${S.escapeHTML(whisper)}</div>
            <div class="ambient-motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
            <div class="portal" aria-hidden="true"></div>
            <div class="land" aria-hidden="true"></div>
            <article class="companion-card">
              <div class="companion-portrait" aria-hidden="true">${S.escapeHTML(presentation.companionIcon)}</div>
              <div class="companion-speech">
                <strong>Che storia facciamo oggi?</strong>
                <span>${S.escapeHTML(companion)} può partire dal tuo momento, dal vostro mondo oppure da una nuova idea.</span>
                <a class="action" href="/story.html">Scegliamo insieme</a>
              </div>
            </article>
          </div>
        </section>`;

      const resumeButton = document.getElementById('resumeStory');
      if(resumeButton && lastStory) resumeButton.addEventListener('click',() => S.openSavedStory(lastStory));
    })();
  </script>
</body>
</html>
