<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FABLEA | La sua Casa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/fablea.css">
  <link rel="stylesheet" href="/assets/css/fablea-unified.css">
  <link rel="stylesheet" href="/assets/css/fablea-beta.css">
  <script src="/assets/js/fablea-profile.js"></script>
  <script src="/assets/js/fablea-companion.js"></script>
  <script src="/assets/js/fablea-companion-moods.js"></script>
  <script src="/assets/js/fablea-world-art.js"></script>
  <script src="/assets/js/fablea-beta-state.js"></script>
</head>
<body class="beta-page">
  <div class="beta-frame">
    <header class="beta-top">
      <a class="beta-brand" href="/child-hub.html">FABLEA</a>
      <div class="beta-pill" id="worldLabel">La sua Casa</div>
      <nav class="beta-nav" aria-label="Navigazione della Casa">
        <a href="/world.html">Mondo</a>
        <a href="/profile.html">Profili</a>
        <a class="always" href="/parent-area.html">Area genitore</a>
      </nav>
    </header>

    <main id="root"></main>
  </div>

  <script>
    (() => {
      'use strict';
      const F = window.FableaProfile;
      const B = window.FableaBetaState;
      const C = window.FableaCompanion;
      const M = window.FableaCompanionMood;
      const root = document.getElementById('root');
      let profile = F.getSelectedProfile();
      if(!profile){
        root.innerHTML = `<section class="beta-card beta-today"><div class="beta-eyebrow">Prima di iniziare</div><h1>Crea il primo mondo.</h1><p class="beta-lead">Ogni bambino ha bisogno di una Casa separata per storie, attività e ricordi.</p><div class="beta-actions"><a class="beta-button primary" href="/onboarding.html">Crea profilo</a></div></section>`;
        return;
      }
      if(C) profile = C.ensureProfile(profile) || profile;
      const continuity = B.reconcile(profile);
      const recommendation = continuity.recommendation;
      const summary = B.summary(profile);
      const artifact = summary.artifact;
      const welcome = new URLSearchParams(location.search).get('welcome') === '1';
      document.body.dataset.world = profile.primaryWorld || 'FABLEA';
      document.getElementById('worldLabel').textContent = profile.primaryWorld;

      const traces = [];
      if(summary.storyCount) traces.push(`${summary.storyCount} ${summary.storyCount === 1 ? 'storia vissuta' : 'storie vissute'}`);
      if(summary.activityCount) traces.push(`${summary.activityCount} ${summary.activityCount === 1 ? 'percorso' : 'percorsi'}`);
      summary.skills.slice(0,3).forEach(skill => traces.push(skill));

      root.innerHTML = `
        <section class="beta-child-hero">
          <article class="beta-card beta-today">
            <div class="beta-today-content">
              <div class="beta-eyebrow">${F.escapeHTML(recommendation.eyebrow)}</div>
              <div class="beta-today-icon" aria-hidden="true">${F.escapeHTML(recommendation.icon)}</div>
              <h1>${F.escapeHTML(recommendation.title)}</h1>
              <p class="beta-lead">${F.escapeHTML(recommendation.description)}</p>
              <div class="beta-actions"><a class="beta-button primary" href="${F.escapeHTML(recommendation.href)}">${F.escapeHTML(recommendation.action)}</a><a class="beta-button secondary" href="/world.html">Guarda cosa è cambiato</a></div>
              ${traces.length ? `<div class="beta-trace-strip">${traces.map(trace => `<span class="beta-trace">${F.escapeHTML(trace)}</span>`).join('')}</div>` : ''}
            </div>
          </article>

          <aside class="beta-card beta-companion-panel">
            <div>
              <div class="beta-eyebrow" style="color:#f1d596">${welcome ? 'La Casa è pronta' : `Nel mondo di ${F.escapeHTML(profile.name)}`}</div>
              <h2 style="font:700 2.8rem/1 'Cormorant Garamond',serif;margin:10px 0">${F.escapeHTML(profile.favoriteCompanion || 'Il suo compagno')}</h2>
            </div>
            <div class="beta-companion-panel-art" id="homeCompanion"></div>
            <p id="companionLine">${F.escapeHTML(M ? M.line('home',welcome ? 'happy' : 'calm') : 'Scegliamo insieme da dove iniziare.')}</p>
          </aside>
        </section>

        <nav class="beta-room-grid" aria-label="Stanze della Casa">
          <a class="beta-card beta-room" href="/discover.html"><span class="beta-room-icon">📖</span><div><h2>Leggiamo</h2><p>Storie originali, classici e racconti già iniziati.</p><small>Entra nella Biblioteca →</small></div></a>
          <a class="beta-card beta-room" href="/story.html"><span class="beta-room-icon">✨</span><div><h2>Inventiamo</h2><p>Una nuova avventura dal mondo, da un momento o da un’idea.</p><small>Entra nell’Officina →</small></div></a>
          <a class="beta-card beta-room" href="/play.html"><span class="beta-room-icon">🧩</span><div><h2>Giochiamo</h2><p>Parole, memoria e logica senza voti né classifiche.</p><small>Segui il Sentiero →</small></div></a>
          <a class="beta-card beta-room" href="/learn.html"><span class="beta-room-icon">🔭</span><div><h2>Scopriamo</h2><p>Natura, numeri, linguaggio e domande da esplorare.</p><small>Apri il Laboratorio →</small></div></a>
        </nav>

        ${artifact ? `<section class="beta-card beta-world-change">
          <div class="beta-artifact" aria-hidden="true">${F.escapeHTML(artifact.icon)}</div>
          <div><div class="beta-eyebrow">Il mondo è cambiato</div><h3>${F.escapeHTML(artifact.title)}</h3><p>${F.escapeHTML(artifact.consequence)}</p></div>
          <a class="beta-button secondary" href="/world.html">Apri la Stanza dei ricordi</a>
        </section>` : `<section class="beta-card beta-world-change"><div class="beta-artifact">⌂</div><div><div class="beta-eyebrow">La Casa è pronta</div><h3>Il primo ricordo deve ancora arrivare.</h3><p>Una storia o un percorso lasceranno qui una traccia visibile.</p></div><a class="beta-button secondary" href="/discover.html">Scegli la prima storia</a></section>`}
      `;

      if(M) M.mount('#homeCompanion',profile,welcome ? 'happy' : 'calm');
      else if(C) C.mount('#homeCompanion',profile);
    })();
  </script>
</body>
</html>
