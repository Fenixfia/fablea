<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FABLEA | Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/fablea.css">
  <link rel="stylesheet" href="/assets/css/fablea-unified.css">
  <link rel="stylesheet" href="/assets/css/fablea-library.css">
  <link rel="stylesheet" href="/assets/css/fablea-beta.css">
  <script src="/assets/js/fablea-grammar.js"></script>
  <script src="/assets/js/fablea-profile.js"></script>
  <script src="/stories-v2/age-2-4.js"></script>
  <script src="/stories-v2/age-5-7.js"></script>
  <script src="/stories-v2/age-8-10.js"></script>
  <script src="/stories-v2/age-11-12.js"></script>
  <script src="/stories-v2/index.js"></script>
  <script src="/stories-classics/catalog.js"></script>
  <script src="/stories-classics/catalog-expansion.js"></script>
  <script src="/assets/js/fablea-classic-art.js"></script>
  <script src="/assets/js/fablea-story-engine.js"></script>
  <script src="/assets/js/fablea-world-state-v3.js"></script>
  <script src="/assets/js/fablea-story-variables-v3.js"></script>
  <script src="/assets/js/fablea-story-engine-v3.js"></script>
  <script src="/assets/js/fablea-shell.js"></script>
</head>
<body class="beta-page">
  <div class="beta-frame">
    <header class="beta-top">
      <a class="beta-brand" href="/child-hub.html">FABLEA</a>
      <div class="beta-pill" id="libraryLabel">Biblioteca</div>
      <nav class="beta-nav"><a href="/child-hub.html">Casa</a><a href="/library.html">Le mie storie</a><a class="always" href="/profile.html">Profili</a></nav>
    </header>
    <main id="root"></main>
  </div>

  <script>
    (() => {
      'use strict';
      const F = window.FableaProfile;
      const S = window.FableaShell;
      const A = window.FableaClassicArt;
      const profile = F.getSelectedProfile();
      const root = document.getElementById('root');
      const params = new URLSearchParams(location.search);
      let activeCollection = params.get('collection') === 'classic' ? 'classic' : 'original';
      let activeFamily = 'all';
      let selectedDuration = profile ? profile.duration : 'Media';

      if(!profile){
        root.innerHTML = `<section class="beta-card beta-today"><div class="beta-eyebrow">Prima scegli un profilo</div><h1>La Biblioteca cambia con l’età.</h1><p class="beta-lead">Ogni bambino vede storie e ricordi separati.</p><div class="beta-actions"><a class="beta-button primary" href="/profile.html">Vai ai profili</a></div></section>`;
        return;
      }
      document.body.dataset.world = profile.primaryWorld || 'FABLEA';
      document.getElementById('libraryLabel').textContent = `Biblioteca · ${F.ageLabel(profile.age)}`;

      const cover = story => A && A.render ? A.render(story) : `<span style="font-size:4rem">${F.escapeHTML(story.icon || '📖')}</span>`;
      const collectionTitle = () => activeCollection === 'classic' ? 'Storie che attraversano il tempo.' : 'Storie nate per entrare nel suo mondo.';
      const collectionIntro = () => activeCollection === 'classic'
        ? 'Classici rinarrati da zero per la sua età, con un linguaggio contemporaneo e un’identità visiva FABLEA.'
        : 'Avventure originali che possono ricordare luoghi, compagni e scelte delle esperienze precedenti.';

      function render(){
        const available = S.storiesFor(profile,{collection:activeCollection});
        const stories = available.filter(story => activeFamily === 'all' || story.family === activeFamily);
        root.innerHTML = `
          <header class="beta-library-head">
            <div><div class="beta-eyebrow">Biblioteca di ${F.escapeHTML(profile.name)}</div><h1 class="beta-title">${collectionTitle()}</h1><p class="beta-lead">${collectionIntro()}</p></div>
            <a class="beta-button secondary" href="/story.html">＋ Inventiamo una storia</a>
          </header>

          <nav class="beta-collection-tabs" aria-label="Collane">
            <button class="beta-tab ${activeCollection === 'original' ? 'active' : ''}" type="button" data-collection="original">Originali</button>
            <button class="beta-tab ${activeCollection === 'classic' ? 'active' : ''}" type="button" data-collection="classic">Classici</button>
            <a class="beta-button secondary" href="/library.html">Storie già vissute</a>
          </nav>

          <section class="beta-library-tools">
            <div class="beta-filter-row" aria-label="Atmosfera">
              ${[['all','Tutte'],['avventura','Avventura'],['calma-sera','Calma'],['emozioni','Emozioni'],['scoperta','Scoperta']].map(([value,label]) => `<button class="beta-filter ${activeFamily === value ? 'active' : ''}" type="button" data-family="${value}">${label}</button>`).join('')}
            </div>
            <div class="beta-filter-row" aria-label="Durata">
              ${F.DURATIONS.map(duration => `<button class="beta-filter ${selectedDuration === duration ? 'active' : ''}" type="button" data-duration="${duration}">${duration}</button>`).join('')}
            </div>
          </section>

          <section class="beta-story-grid" aria-live="polite">
            ${stories.map(story => `<article class="beta-card beta-story-card">
              <div class="beta-story-cover" aria-hidden="true">${cover(story)}</div>
              <div class="beta-story-body">
                <div class="beta-story-kicker">${F.escapeHTML(S.familyLabel(story.family))}</div>
                <h2>${F.escapeHTML(S.previewTemplate(story.title,profile))}</h2>
                <p>${F.escapeHTML(S.previewTemplate(story.subtitle,profile))}</p>
                <div class="beta-story-meta"><span>${F.escapeHTML(selectedDuration)}</span><span>${F.escapeHTML(F.ageLabel(profile.age))}</span></div>
                <button class="beta-button primary" type="button" data-story-id="${F.escapeHTML(story.id)}">Apri il Libro vivo</button>
              </div>
            </article>`).join('') || `<section class="beta-card beta-today"><h2>Nessuna storia in questa atmosfera.</h2><p>Prova un filtro diverso.</p></section>`}
          </section>

          ${activeCollection === 'classic' ? `<details class="beta-card beta-editorial-details"><summary>Informazioni sull’opera per i grandi</summary><p>Le trame e i personaggi derivano da opere originali considerate candidate al pubblico dominio. Testi, dialoghi, adattamento per età e illustrazioni sono creazioni FABLEA. Prima del lancio commerciale è comunque prevista una verifica legale per territorio e non vengono copiate traduzioni moderne, illustrazioni celebri o versioni cinematografiche.</p></details>` : ''}
        `;

        root.querySelectorAll('[data-collection]').forEach(button => button.addEventListener('click',() => {activeCollection = button.dataset.collection;activeFamily = 'all';history.replaceState(null,'',`/discover.html?collection=${activeCollection}`);render();}));
        root.querySelectorAll('[data-family]').forEach(button => button.addEventListener('click',() => {activeFamily = button.dataset.family;render();}));
        root.querySelectorAll('[data-duration]').forEach(button => button.addEventListener('click',() => {selectedDuration = button.dataset.duration;render();}));
        root.querySelectorAll('[data-story-id]').forEach(button => button.addEventListener('click',() => {
          const story = S.catalogStoryById(profile,button.dataset.storyId);
          if(story) S.openCatalogStory(profile,story,selectedDuration);
        }));
      }
      render();
    })();
  </script>
</body>
</html>
