<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FABLEA | Il suo mondo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/fablea.css">
  <link rel="stylesheet" href="/assets/css/fablea-unified.css">
  <link rel="stylesheet" href="/assets/css/fablea-beta.css">
  <script src="/assets/js/fablea-profile.js"></script>
  <script src="/stories-v2/age-2-4.js"></script>
  <script src="/stories-v2/age-5-7.js"></script>
  <script src="/stories-v2/age-8-10.js"></script>
  <script src="/stories-v2/age-11-12.js"></script>
  <script src="/stories-v2/index.js"></script>
  <script src="/assets/js/fablea-story-engine.js"></script>
  <script src="/assets/js/fablea-world-state-v3.js"></script>
  <script src="/assets/js/fablea-shell.js"></script>
  <script src="/assets/js/fablea-world-art.js"></script>
  <script src="/assets/js/fablea-beta-state.js"></script>
</head>
<body class="beta-page">
  <div class="beta-frame">
    <header class="beta-top">
      <a class="beta-brand" href="/child-hub.html">FABLEA</a>
      <div class="beta-pill" id="worldLabel">Il suo mondo</div>
      <nav class="beta-nav"><a href="/child-hub.html">Casa</a><a href="/discover.html">Biblioteca</a><a class="always" href="/profile.html">Profili</a></nav>
    </header>
    <main id="root"></main>
  </div>

  <script>
    (() => {
      'use strict';
      const F = window.FableaProfile;
      const S = window.FableaShell;
      const W3 = window.FableaWorldStateV3;
      const A = window.FableaWorldArt;
      const B = window.FableaBetaState;
      const profile = F.getSelectedProfile();
      const root = document.getElementById('root');
      if(!profile){
        root.innerHTML = `<section class="beta-card beta-today"><h1>Questo mondo non è ancora nato.</h1><p class="beta-lead">Crea o seleziona un profilo.</p><div class="beta-actions"><a class="beta-button primary" href="/profile.html">Vai ai profili</a></div></section>`;
        return;
      }

      document.body.dataset.world = profile.primaryWorld || 'FABLEA';
      document.getElementById('worldLabel').textContent = profile.primaryWorld;
      const summary = B.summary(profile);
      const continuity = B.reconcile(profile);
      const memory = B.memory(profile);
      const stories = B.savedStories(profile);
      const latestStory = summary.lastStory;
      const progress = B.activity(profile);
      const artifact = summary.artifact;
      const recommendation = continuity.recommendation;
      const worldState = W3 ? W3.get(profile) : null;
      const openThreads = worldState ? (worldState.openThreads || []).filter(item => item.status !== 'closed') : [];
      const decisions = worldState ? (worldState.decisions || []).slice(0,5) : [];
      const recent = stories.slice().reverse().slice(0,3);

      root.innerHTML = `
        <section class="beta-world-header">
          <div class="beta-card beta-world-header-copy">
            <div class="beta-eyebrow">Il mondo di ${F.escapeHTML(profile.name)}</div>
            <h1 class="beta-title">${F.escapeHTML(profile.primaryWorld)}</h1>
            <p class="beta-lead">Qui storie, oggetti, attività e domande restano collegate. Non è una raccolta di risultati: è la memoria di ciò che è stato vissuto.</p>
            <div class="beta-trace-strip"><span class="beta-trace">${summary.storyCount} storie</span><span class="beta-trace">${summary.activityCount} percorsi</span><span class="beta-trace">${summary.treasures.length} tesori</span></div>
          </div>
          <div class="beta-card beta-world-header-art">${A.render(profile.primaryWorld,{label:`Il mondo di ${profile.name}`})}</div>
        </section>

        <section class="beta-continuity" aria-label="Come il mondo sta continuando">
          <article class="beta-card beta-continuity-step"><span>📖</span><b>Ultima storia</b><p>${latestStory ? F.escapeHTML(latestStory.title) : 'La prima storia deve ancora iniziare.'}</p></article>
          <article class="beta-card beta-continuity-step"><span>${artifact ? F.escapeHTML(artifact.icon) : '⌂'}</span><b>Ciò che è rimasto</b><p>${artifact ? F.escapeHTML(artifact.title) : 'Il primo oggetto apparirà dopo una storia.'}</p></article>
          <article class="beta-card beta-continuity-step"><span>🧩</span><b>Ultima scoperta</b><p>${progress.last ? F.escapeHTML((progress.last.skills || []).join(', ') || 'Un percorso completato') : 'Nessun percorso ancora esplorato.'}</p></article>
          <article class="beta-card beta-continuity-step"><span>${F.escapeHTML(recommendation.icon)}</span><b>Prossima porta</b><p>${F.escapeHTML(recommendation.title)}</p></article>
        </section>

        <section class="beta-world-grid">
          <article class="beta-card beta-world-panel featured"><div class="beta-eyebrow">Stanza dei ricordi</div><h2>${artifact ? F.escapeHTML(artifact.title) : 'La stanza è ancora vuota'}</h2><p>${artifact ? F.escapeHTML(artifact.consequence) : 'La prima esperienza importante lascerà qui un oggetto, una frase o un segno.'}</p>${artifact && artifact.storyTitle ? `<span class="beta-trace">Da ${F.escapeHTML(artifact.storyTitle)}</span>` : ''}</article>
          <article class="beta-card beta-world-panel"><div class="beta-eyebrow">Capacità incontrate</div><h2>${summary.skills.length} tracce</h2><div class="beta-trace-strip">${summary.skills.length ? summary.skills.map(skill => `<span class="beta-trace">${F.escapeHTML(skill)}</span>`).join('') : '<span class="beta-note">Giochiamo e Scopriamo aggiungeranno qui nuove tracce.</span>'}</div></article>
          <article class="beta-card beta-world-panel"><div class="beta-eyebrow">Fuori dallo schermo</div><h2>${summary.lastMission ? 'Una missione aperta' : 'Il mondo reale aspetta'}</h2><p>${F.escapeHTML(summary.lastMission || 'Dopo un percorso apparirà una proposta da fare, osservare o raccontare lontano dal telefono.')}</p></article>
          <article class="beta-card beta-world-panel"><div class="beta-eyebrow">Fili ancora aperti</div><h2>${openThreads.length} domande</h2><div class="beta-trace-strip">${openThreads.length ? openThreads.slice(0,5).map(item => `<span class="beta-trace">${F.escapeHTML(item.text)}</span>`).join('') : '<span class="beta-note">Le nuove storie potranno aprire un mistero con naturalezza.</span>'}</div></article>
          <article class="beta-card beta-world-panel"><div class="beta-eyebrow">Scelte ricordate</div><h2>${decisions.length} decisioni</h2><div class="beta-trace-strip">${decisions.length ? decisions.map(item => `<span class="beta-trace">${F.escapeHTML(item.text)}</span>`).join('') : '<span class="beta-note">Le decisioni importanti compariranno qui senza diventare voti.</span>'}</div></article>
          <article class="beta-card beta-world-panel"><div class="beta-eyebrow">Adesso</div><h2>${F.escapeHTML(recommendation.title)}</h2><p>${F.escapeHTML(recommendation.description)}</p><a class="beta-button primary" href="${F.escapeHTML(recommendation.href)}">${F.escapeHTML(recommendation.action)}</a></article>
        </section>

        ${recent.length ? `<section class="beta-section"><div class="beta-section-head"><div class="beta-eyebrow">Ultime storie</div><h2 class="beta-title">Le porte che hanno cambiato il mondo.</h2></div><div class="beta-story-grid">${recent.map(story => `<article class="beta-card beta-story-card"><div class="beta-story-body"><div class="beta-story-kicker">${F.escapeHTML(story.world || profile.primaryWorld)}</div><h2>${F.escapeHTML(story.title)}</h2><p>${F.escapeHTML(story.v3Consequences && story.v3Consequences.summary || story.subtitle || 'Una traccia conservata nel mondo.')}</p><button class="beta-button secondary" type="button" data-saved-id="${F.escapeHTML(story.id)}">Riapri</button></div></article>`).join('')}</div></section>` : ''}
      `;

      root.querySelectorAll('[data-saved-id]').forEach(button => button.addEventListener('click',() => {
        const story = stories.find(item => item.id === button.dataset.savedId);
        if(story) S.openSavedStory(story);
      }));
    })();
  </script>
</body>
</html>
