<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FABLEA | Libreria</title><link rel="stylesheet" href="/assets/css/fablea.css"><script src="/assets/js/fablea-ui.js"></script><script src="/assets/js/fablea-grammar.js"></script><script src="/assets/js/fablea-profile.js"></script><script src="/stories-v2/age-2-4.js"></script><script src="/stories-v2/age-5-7.js"></script><script src="/stories-v2/age-8-10.js"></script><script src="/stories-v2/age-11-12.js"></script><script src="/stories-v2/index.js"></script><script src="/assets/js/fablea-story-engine.js"></script></head><body class="fablea-page theme-night"><main class="page"><div class="top"><a class="back" href="/child-hub.html">← Mondo</a><div class="badge">Libreria v2</div></div><section class="hero"><h1>Libreria dei mondi v2.</h1><div class="intro">Mostra solo storie v2 e storie salvate con snapshot del profilo.</div></section><div id="saved"></div><h2 class="section-title">Catalogo principale v2</h2><div id="catalog"></div></main><script>
const F=FableaProfile,E=FableaStoryEngine,p=F.getSelectedProfile(); const stories=JSON.parse(localStorage.getItem('fableaSavedStories')||'[]').filter(s=>!p||s.childId===p.id||s.child===p.name); saved.innerHTML='<h2 class="section-title">Storie vissute</h2>'+(stories.length?`<div class="grid">${stories.map(s=>`<div class="card"><h2>${F.escapeHTML(s.title)}</h2><p>${F.escapeHTML(s.subtitle||'')}</p><div class="tags"><span class="tag">${F.escapeHTML(s.child)}</span><span class="tag">${F.escapeHTML(s.world||s.theme)}</span><span class="tag">${s.wordCount||E.words(s.text)} parole</span></div><button class="button secondary" onclick="openStory('${s.id}')">Riapri</button></div>`).join('')}</div>`:'<div class="empty">Nessuna storia salvata.</div>'); function openStory(id){const s=stories.find(x=>x.id===id); localStorage.setItem('fableaCurrentStory',JSON.stringify(s)); localStorage.setItem('fableaReopenStory','true'); location.href='/story-result.html';} catalog.innerHTML=`<div class="grid">${E.catalog().map(s=>`<div class="card"><h2>${F.escapeHTML(s.title.replaceAll('{name}',''))}</h2><p>${F.escapeHTML(s.subtitle)}</p><div class="tags"><span class="tag">${s.age}</span><span class="tag">${s.family}</span><span class="tag">${s.pages.length} scene</span></div></div>`).join('')}</div>`;
</script></body></html>
